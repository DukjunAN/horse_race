<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>경주마 스타트 Pro - 멀티플레이</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <!-- pixel-ish UI: RUN(영문) / 점프(한글) 모두 웹폰트로 지원 -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser-arcade-physics.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js" crossorigin="anonymous"></script>
    <style>
        #game-container { width: 100%; height: 100%; }
    </style>
</head>
<body>
<div id="game-container"></div>
<!-- Title / Lobby DOM UI (로딩 실패 시에도 화면 보이도록 기본 표시) -->
<div id="ui-overlay" class="active">
    <div id="title-panel" class="title-panel">
        <h1>경주마 스타트 Pro</h1>
        <p class="sub">멀티플레이</p>
        <div class="title-top3" id="title-top3">
            <div class="title-top3-head">TOP 3 BEST TIME</div>
            <ul id="title-top3-list"><li>기록 불러오는 중...</li></ul>
        </div>
        <div class="nickname-wrap">
            <input type="text" id="nickname-input" placeholder="별명 입력" maxlength="20" autocomplete="off">
            <div class="title-actions">
                <button type="button" class="btn-start secondary" id="btn-solo-start">혼자하기</button>
                <button type="button" class="btn-start" id="btn-multi-start">같이하기</button>
            </div>
        </div>
    </div>
    <div id="lobby-panel" class="lobby-panel hidden">
        <h2>대기방</h2>
        <div class="countdown" id="lobby-countdown"></div>
        <p class="message" id="lobby-message">다른 참여자 대기 중...</p>
        <ul class="player-list" id="player-list"></ul>
        <div class="lobby-actions">
            <button type="button" class="btn-lobby primary" id="btn-start-now">시작하기</button>
            <button type="button" class="btn-lobby secondary" id="btn-leave">나가기</button>
        </div>
    </div>
</div>

<script>
// ---------- 소켓 서버 ----------
// 로컬(node server.js)에서는 같은 호스트(예: http://localhost:3000)로 연결.
// 정적 배포(Netlify 등)에서는 window.SOCKET_URL 또는 아래 Render URL 사용.
const _isLocalHost =
    typeof window !== 'undefined' &&
    ['localhost', '127.0.0.1', '::1'].includes(window.location.hostname);
// 비로컬 호스트는 Render 소켓 사용. server.js(막 색 랜덤 등) 수정 시 Render 재배포 필요.
const SOCKET_URL =
    window.SOCKET_URL ||
    (_isLocalHost ? window.location.origin : 'https://horse-race-qo6o.onrender.com');
const API_BASE_URL = (SOCKET_URL || window.location.origin).replace(/\/$/, '');

const TARGET_DISTANCE = 8000;
/** AI(컴퓨터) 말 전진 속도 배율 — 기본 0.6~1.2에 곱해짐 */
const AI_RUN_SPEED_MULTIPLIER = 1.8;
const COLOR_ORDER = ['red', 'blue', 'green', 'yellow'];
const HORSE_COLORS_HEX = { red: 0xe53935, blue: 0x1e88e5, green: 0x43a047, yellow: 0xfdd835 };
/** 달리기 6프레임 스프라이트시트 (팀 색 순서와 매칭) */
const RUN_SPRITE_SHEETS = {
    red: 'black_horse_red_man_run.png',
    blue: 'brown_horse_blue_man_run.png',
    green: 'brownspot_horse_green_man_run.png',
    yellow: 'basie_horse_yellow_man_run.png'
};
/** 대기(서 있음) 스프라이트시트 — 가로 8프레임 */
const IDLE_STAND_FRAMES = 8;
const STAND_SPRITE_SHEETS = {
    red: 'black_horse_red_man_stand.png',
    blue: 'brown_horse_blue_man_stand.png',
    green: 'brownspot_horse_green_man_stand.png',
    yellow: 'basie_horse_yellow_man_stand.png'
};

// ===== 타일셋(track_tile.png)에서 트랙 패턴 텍스처 생성 =====
function buildTrackPatternTexture(scene) {
    const sourceKey = 'track_tile_tex';
    if (!scene.textures.exists(sourceKey)) return null;
    const src = scene.textures.get(sourceKey).getSourceImage();
    const tileSize = 64;
    const cols = 7;
    const rows = 7;
    const totalTiles = 47; // 사용자 제공 스펙

    const sampleCanvas = document.createElement('canvas');
    sampleCanvas.width = src.width;
    sampleCanvas.height = src.height;
    const sctx = sampleCanvas.getContext('2d');
    sctx.drawImage(src, 0, 0);

    const tiles = [];
    for (let i = 0; i < totalTiles; i++) {
        const tx = (i % cols) * tileSize;
        const ty = Math.floor(i / cols) * tileSize;
        if (ty >= rows * tileSize) break;
        const img = sctx.getImageData(tx, ty, tileSize, tileSize).data;
        let rSum = 0, gSum = 0, bSum = 0, cnt = 0, bright = 0;
        for (let p = 0; p < img.length; p += 4) {
            const a = img[p + 3];
            if (a < 10) continue;
            const r = img[p], g = img[p + 1], b = img[p + 2];
            rSum += r; gSum += g; bSum += b; cnt++;
            if (r > 205 && g > 205 && b > 205) bright++;
        }
        if (!cnt) continue;
        const rAvg = rSum / cnt;
        const gAvg = gSum / cnt;
        const bAvg = bSum / cnt;
        const brightRatio = bright / cnt;
        // grass: 녹색 우세 + 갈색/밝은 라인 비율이 낮은 타일 선호
        const grassScore = (gAvg - rAvg) * 1.8 + (gAvg - bAvg) - brightRatio * 40;
        // lane: 갈색(적/녹) 우세 + 파란색 낮음 + 흰 라인(밝기) 약간 포함, 녹색 우세는 강한 감점
        const laneBrown = (rAvg * 0.9 + gAvg * 0.7) - bAvg * 1.2;
        const greenPenalty = Math.max(0, gAvg - rAvg) * 2.0;
        const laneScore = laneBrown + brightRatio * 120 - greenPenalty;
        tiles.push({ i, tx, ty, grassScore, laneScore, rAvg, gAvg, bAvg, brightRatio });
    }
    if (!tiles.length) return null;

    // 여러 타일을 섞으면 깨진 패턴이 보일 수 있어, 대표 타일 1개씩만 선택
    const bestGrass = [...tiles].sort((a, b) => b.grassScore - a.grassScore)[0] || tiles[0];
    // lane은 녹색 우세 타일을 제외하고 선택
    const laneCandidates = tiles.filter(t => t.rAvg >= t.gAvg - 5);
    const bestLane = [...(laneCandidates.length ? laneCandidates : tiles)]
        .sort((a, b) => b.laneScore - a.laneScore)[0] || tiles[0];

    const outCols = 10;
    // 요청 구조:
    // grass_top 2타일 + lane1 2타일 + lane2 2타일 + lane3 2타일 + lane4 2타일 + grass_bottom 2타일
    // 총 12타일 높이
    const outRows = 12;
    const outCanvas = document.createElement('canvas');
    outCanvas.width = outCols * tileSize;
    outCanvas.height = outRows * tileSize;
    const octx = outCanvas.getContext('2d');

    for (let y = 0; y < outRows; y++) {
        // y: 0~1 상단 잔디, 2~9 레인 4개(각 2타일), 10~11 하단 잔디
        const useLane = y >= 2 && y <= 9;
        for (let x = 0; x < outCols; x++) {
            const t = useLane ? bestLane : bestGrass;
            octx.drawImage(
                src,
                t.tx, t.ty, tileSize, tileSize,
                x * tileSize, y * tileSize, tileSize, tileSize
            );
        }
    }

    const outKey = 'track_generated_tex';
    if (scene.textures.exists(outKey)) scene.textures.remove(outKey);
    scene.textures.addCanvas(outKey, outCanvas);
    return outKey;
}

// ========== Preload Scene ==========
class PreloadScene extends Phaser.Scene {
    constructor() { super({ key: 'Preload' }); }
    preload() {
        // 달리기: 팀별 6프레임 가로 시트 — horse_raw2(폴백)은 파랑 시트와 동일 파일
        COLOR_ORDER.forEach((c) => {
            this.load.image(`run_${c}_sheet_raw`, RUN_SPRITE_SHEETS[c]);
        });
        this.load.image('horse_raw2', RUN_SPRITE_SHEETS.blue);
        // 대기(서 있음): 팀별 8프레임 가로 시트
        COLOR_ORDER.forEach((c) => {
            this.load.image(`idle_${c}_sheet_raw`, STAND_SPRITE_SHEETS[c]);
        });

        // 달리기 시트는 위 COLOR_ORDER.forEach(run_*_sheet_raw) 에서 로드
        // ===== 점프 / 실패: 팀별 5프레임 (4색은 8프레임 가로 시트로 별도) =====
        this.load.image('jump_blue_sheet_raw', 'brown_horse_blue_main_jump.png');
        this.load.image('jump_red_sheet_raw', 'black_horse_red_man_jump.png');
        this.load.image('jump_yellow_sheet_raw', 'basie_horse_yellow_man_jump.png');
        this.load.image('jump_green_sheet_raw', 'brownspot_horse_green_man_jump.png');
        this.load.image('fail_blue_sheet_raw', 'brown_horse_blue_man_fail.png');
        this.load.image('fail_green_sheet_raw', 'brownspot_horse_green_man_fail.png');
        this.load.image('fail_red_sheet_raw', 'black_horse_red_man_fail.png');
        this.load.image('fail_yellow_sheet_raw', 'basie_horse_yellow_man_fail.png');
        // 관중: 캔버스로 그랜드스탠드 스프라이트 시트 생성(전폭·다단·응원 포즈). 별도 PNG 없이 동작
        // 장애물 스프라이트 (허들 + 물웅덩이) – 같은 폴더의 Obstacle.png
        this.load.image('obstacle_raw', 'Obstacle.png');
        // 트랙 이미지 (Track.png) – 코드로 그리던 흙 트랙을 대체
        this.load.image('track_tex', 'Track.png');
        this.load.spritesheet('desert_assets', 'assets/desert_assets.png', { frameWidth: 64, frameHeight: 64 });
        this.load.image('single_track', 'single_track.png');
        this.load.image('gate_close', 'gate_close.png');
        this.load.image('gate_half_open', 'gate_half_open.png');
        this.load.image('gate_open', 'gate_open.png');
        this.load.once('loaderror', () => {});
    }
    create() {
        this.scene.start('Title');
    }
}

// ========== Title Scene ==========
class TitleScene extends Phaser.Scene {
    constructor() { super({ key: 'Title' }); }
    create() {
        const el = document.getElementById('ui-overlay');
        const title = document.getElementById('title-panel');
        const lobby = document.getElementById('lobby-panel');
        el.classList.remove('hidden');
        el.classList.add('active');
        title.classList.remove('hidden');
        lobby.classList.add('hidden');
        const input = document.getElementById('nickname-input');
        const btnSolo = document.getElementById('btn-solo-start');
        const btnMulti = document.getElementById('btn-multi-start');
        const top3ListEl = document.getElementById('title-top3-list');
        input.value = localStorage.getItem('horse_nickname') || '';
        const renderTopTimes = (rows) => {
            if (!top3ListEl) return;
            const list = Array.isArray(rows) ? rows.slice(0, 3) : [];
            if (!list.length) {
                top3ListEl.innerHTML = '<li>아직 기록이 없습니다.</li>';
                return;
            }
            top3ListEl.innerHTML = list.map((r, i) => {
                const name = String(r.nickname || 'Player');
                const t = Number(r.finishTimeSec);
                const time = Number.isFinite(t) ? `${t.toFixed(2)}s` : '--';
                return `<li><span>${i + 1}. ${name}</span><b>${time}</b></li>`;
            }).join('');
        };
        fetch(`${API_BASE_URL}/api/top-times?trackId=single_track&limit=3`)
            .then((r) => {
                if (!r.ok) throw new Error('top-times fetch failed');
                return r.json();
            })
            .then((data) => renderTopTimes(data && data.top))
            .catch(() => {
                if (top3ListEl) top3ListEl.innerHTML = '<li>기록을 불러오지 못했습니다.</li>';
            });
        const getNickname = () => {
            const nickname = (input.value || '').trim().slice(0, 20) || 'Player';
            localStorage.setItem('horse_nickname', nickname);
            window.gameState = window.gameState || {};
            window.gameState.nickname = nickname;
            return nickname;
        };
        const clearExistingSocket = () => {
            if (window.gameState && window.gameState.socket) {
                try {
                    window.gameState.socket.removeAllListeners();
                    window.gameState.socket.disconnect();
                } catch (e) { /* ignore */ }
            }
            window.gameState.socket = null;
        };

        btnSolo.onclick = () => {
            if (window.gameState && window.gameState.connecting) return;
            const nickname = getNickname();
            clearExistingSocket();
            window.gameState.connecting = false;
            const soloColors = ['red', 'blue', 'green', 'yellow'];
            const soloColor = soloColors[Math.floor(Math.random() * soloColors.length)];
            window.gameState.myColor = soloColor;
            window.gameState.myNickname = nickname;
            window.gameState.isHost = true;
            window.gameState.players = [
                { id: 'solo_me', nickname, color: soloColor, isHost: true }
            ];
            el.classList.add('hidden');
            el.classList.remove('active');
            this.scene.start('Game', { players: window.gameState.players, obstacles: [], soloMode: true });
        };

        btnMulti.onclick = () => {
            // 이미 서버 연결 시도 중이면 중복 클릭 무시
            if (window.gameState && window.gameState.connecting) return;

            const nickname = getNickname();
            window.gameState.connecting = true;
            delete window.gameState.myColor;
            clearExistingSocket();

            // 중복 접속 방지: 버튼 비활성화 + 안내 문구
            const originalText = btnMulti.dataset.originalText || btnMulti.textContent;
            btnMulti.dataset.originalText = originalText;
            btnMulti.disabled = true;
            btnMulti.textContent = '서버 연결 대기중...';
            btnSolo.disabled = true;

            // Netlify(정적) + Render(소켓) 조합에서 XHR polling이 막히면 오류가 납니다.
            // polling fallback을 끄고 websocket 전송만 사용합니다.
            const socket = io(SOCKET_URL || window.location.origin, {
                // polling -> websocket 업그레이드로 폴백(서버/프록시 환경에 따라 websocket 단독이 404 날 수 있음)
                transports: ['polling', 'websocket'],
                path: '/socket.io',
                withCredentials: false,
                upgrade: true
            });
            socket.once('your_info', (data) => {
                window.gameState.connecting = false;
                btnMulti.disabled = false;
                btnMulti.textContent = btnMulti.dataset.originalText || '같이하기';
                btnSolo.disabled = false;

                window.gameState.socket = socket;
                window.gameState.myColor = data.color;
                window.gameState.myNickname = data.nickname;
                window.gameState.isHost = data.isHost;
                window.gameState.players = data.players || [];
                this.scene.start('Lobby', data);
            });
            const requestJoinRoom = () => {
                socket.emit('set_nickname', nickname);
                socket.emit('create_or_join');
            };
            if (socket.connected) {
                requestJoinRoom();
            } else {
                socket.once('connect', requestJoinRoom);
            }
            const onError = (err) => {
                window.gameState.connecting = false;
                btnMulti.disabled = false;
                btnMulti.textContent = btnMulti.dataset.originalText || '같이하기';
                btnSolo.disabled = false;
                alert((err && err.message) || '서버 연결에 실패했습니다.\n잠시 후 다시 시도해 주세요.');
            };
            socket.once('error', onError);
            socket.once('connect_error', onError);
        };
    }
}

// ========== Lobby Scene (DOM 제어) ==========
class LobbyScene extends Phaser.Scene {
    constructor() { super({ key: 'Lobby' }); }
    create(data) {
        const title = document.getElementById('title-panel');
        const lobby = document.getElementById('lobby-panel');
        title.classList.add('hidden');
        lobby.classList.remove('hidden');
        const socket = window.gameState.socket;
        const isHost = window.gameState.isHost;
        const countEl = document.getElementById('lobby-countdown');
        const msgEl = document.getElementById('lobby-message');
        const listEl = document.getElementById('player-list');
        const btnStartNow = document.getElementById('btn-start-now');
        const btnLeave = document.getElementById('btn-leave');

        function renderList(players) {
            window.gameState.players = players || window.gameState.players;
            listEl.innerHTML = (window.gameState.players || []).map(p =>
                `<li><span class="horse-dot ${p.color}"></span> ${p.nickname}${p.isHost ? ' (방장)' : ''}</li>`
            ).join('');
        }
        renderList(data.players);

        socket.on('player_list', renderList);
        socket.on('countdown', (sec) => {
            countEl.textContent = sec > 0 ? sec : '';
            msgEl.textContent = sec > 0 ? '다른 참여자 대기 중... ' + sec + '초 후 시작' : '곧 시작합니다!';
            window.gameState.lastLobbyCountdown = sec;
        });
        socket.once('game_start', (payload) => {
            const overlay = document.getElementById('ui-overlay');
            overlay.classList.add('hidden');
            overlay.classList.remove('active');
            payload.lobbyCountdownAtStart = (window.gameState && typeof window.gameState.lastLobbyCountdown === 'number')
                ? window.gameState.lastLobbyCountdown
                : 0;
            this.scene.start('Game', payload);
        });

        btnStartNow.onclick = () => { if (isHost) socket.emit('start_game'); };
        btnStartNow.style.display = isHost ? 'block' : 'none';
        btnLeave.onclick = () => {
            socket.emit('leave_room');
            socket.removeAllListeners();
            lobby.classList.add('hidden');
            title.classList.remove('hidden');
            document.getElementById('nickname-input').value = window.gameState.nickname || '';
            document.getElementById('ui-overlay').classList.add('active');
            this.scene.start('Title');
        };
    }
}

// ========== Rhythm Button (image_9 기반) ==========
class RhythmButton {
    constructor(scene, x, y, opts) {
        this.scene = scene;
        this.x = x;
        this.y = y;
        this.w = opts.width;
        this.h = opts.height;
        this.mainColor = opts.mainColor;
        this.label = opts.label;
        this.onDown = opts.onDown || null;

        this.radius = opts.radius ?? Math.round(Math.min(this.w, this.h) * 0.22);
        this.depthPx = opts.depthPx ?? Math.max(3, Math.round(this.h * 0.08));
        this.edgeDarkenFactor = opts.edgeDarkenFactor ?? 0.78;

        this.pressScale = opts.pressScale ?? 0.95;
        this.pressOffsetY = opts.pressOffsetY ?? Math.round(this.h * 0.05);
        this.pressDarkenFactor = opts.pressDarkenFactor ?? 0.86;

        this.fontFamily = opts.fontFamily ?? '"Press Start 2P","Noto Sans KR",monospace';
        this.fontSize = opts.fontSize ?? Math.round(this.h * 0.42);

        this.iconBodyColor = opts.iconBodyColor ?? 0x8d6e63; // brown
        this.iconPantsColor = opts.iconPantsColor ?? 0xffffff; // white
        this.iconScale = opts.iconScale ?? 0.40;
        this.iconTextureKey = opts.iconTextureKey ?? null;
        this.iconImage = null;

        this.baseScale = 1;
        this.baseX = x;
        this.baseY = y;
        this.isDown = false;
        this.releaseTween = null;

        this.container = scene.add.container(x, y);
        // 카메라 스크롤에도 UI 버튼이 화면에 고정되도록 스크롤 팩터 0
        this.container.setScrollFactor(0);
        // 트랙 아래 반투명 패널(Depth 100) 위로 버튼이 렌더되도록 depth를 올림
        this.container.setDepth(opts.uiDepth ?? 2000);
        this.bgGfx = scene.add.graphics();
        this.iconGfx = scene.add.graphics();
        this.container.add([this.bgGfx, this.iconGfx]);

        this.labelText = scene.add.text(0, 0, this.label, {
            fontFamily: this.fontFamily,
            fontSize: this.fontSize + 'px',
            color: '#ffffff',
            fontStyle: 'bold',
            align: 'center',
        }).setOrigin(0.5, 0.5).setScrollFactor(0);
        this.container.add(this.labelText);

        // Optional icon texture (e.g. user-made image_8.png)
        if (this.iconTextureKey && scene.textures.exists(this.iconTextureKey)) {
            const iconSize = Math.round(Math.min(this.w, this.h) * this.iconScale);
            const iconLeft = -this.w / 2 + Math.round(this.h * 0.20);
            const iconTop = -iconSize / 2;
            this.iconImage = scene.add.image(iconLeft + iconSize / 2, iconTop + iconSize / 2, this.iconTextureKey);
            this.iconImage.setDisplaySize(iconSize, iconSize);
            this.iconImage.setScrollFactor(0);
            this.container.add(this.iconImage);
        }

        // Input hit area (separate object so pointer events are reliable)
        this.hitArea = scene.add.rectangle(x, y, this.w, this.h, 0x000000, 0)
            .setOrigin(0.5, 0.5)
            .setScrollFactor(0)
            .setDepth(1000)
            .setInteractive({ useHandCursor: true });

        this.hitArea.on('pointerdown', (pointer, localX, localY, event) => {
            if (event && event.stopPropagation) event.stopPropagation();
            this.handleDown();
        });
        this.hitArea.on('pointerup', (pointer) => this.handleUp());
        this.hitArea.on('pointerout', () => {
            if (this.isDown) this.handleUp();
        });

        this.renderUp();
    }

    destroy() {
        this.hitArea?.destroy();
        this.iconImage?.destroy?.();
        this.container?.destroy();
        this.releaseTween?.stop?.();
    }

    handleDown() {
        if (this.isDown) return;
        this.isDown = true;
        this.releaseTween?.stop?.();

        this.container.setScale(this.pressScale);
        this.container.setY(this.baseY + this.pressOffsetY);
        this.hitArea.setScale(this.pressScale);
        this.hitArea.setY(this.baseY + this.pressOffsetY);

        this.renderDown();
        if (this.onDown) this.onDown();
    }

    handleUp() {
        if (!this.isDown) return;
        this.isDown = false;

        this.renderUp();

        this.releaseTween?.stop?.();
        this.releaseTween = this.scene.tweens.add({
            targets: [this.container, this.hitArea],
            scaleX: this.baseScale,
            scaleY: this.baseScale,
            y: this.baseY,
            duration: 190,
            ease: 'Elastic.Out'
        });
    }

    renderUp() {
        this.bgGfx.clear();
        this.iconGfx.clear();

        const w = this.w;
        const h = this.h;
        const r = this.radius;
        const depth = this.depthPx;

        const edgeColor = this.darken(this.mainColor, this.edgeDarkenFactor);

        // Raised side/bottom edge
        this.bgGfx.fillStyle(edgeColor, 1);
        this.bgGfx.fillRoundedRect(
            -w / 2 + depth,
            -h / 2 + depth,
            w,
            h,
            r
        );

        // Main button face
        this.bgGfx.fillStyle(this.mainColor, 1);
        this.bgGfx.fillRoundedRect(
            -w / 2,
            -h / 2,
            w,
            h,
            r
        );

        // Small highlight
        this.bgGfx.fillStyle(0xffffff, 0.22);
        const hiH = Math.max(3, Math.round(h * 0.14));
        this.bgGfx.fillRoundedRect(
            -w / 2 + 2,
            -h / 2 + 2,
            Math.round(w * 0.48),
            hiH,
            Math.max(2, Math.round(r * 0.30))
        );

        this.drawHorseJockeyIcon();
    }

    renderDown() {
        this.bgGfx.clear();
        this.iconGfx.clear();

        const w = this.w;
        const h = this.h;
        const r = this.radius;
        const dark = this.darken(this.mainColor, this.pressDarkenFactor);

        // Pressed: remove raised edge (only flat face)
        this.bgGfx.fillStyle(dark, 1);
        this.bgGfx.fillRoundedRect(
            -w / 2,
            -h / 2,
            w,
            h,
            r
        );

        // Inner highlight
        this.bgGfx.fillStyle(0xffffff, 0.10);
        this.bgGfx.fillRoundedRect(
            -w / 2 + 2,
            -h / 2 + 2,
            Math.round(w * 0.40),
            Math.max(3, Math.round(h * 0.12)),
            Math.max(2, Math.round(r * 0.30))
        );

        this.drawHorseJockeyIcon();
    }

    drawHorseJockeyIcon() {
        if (this.iconImage) return;
        // Requirement: very small simplified "brown horse + white pants jockey"
        // (If you later load image_8.png, you can replace this draw method with drawImage.)
        const w = this.w;
        const h = this.h;

        const iconSize = Math.round(Math.min(w, h) * this.iconScale);
        const grid = 8;
        const px = Math.max(1, Math.floor(iconSize / grid));

        const iconLeft = -w / 2 + Math.round(h * 0.20);
        const iconTop = -iconSize / 2;

        const brown = this.iconBodyColor;
        const pants = this.iconPantsColor;

        const f = (gx, gy, color) => {
            this.iconGfx.fillStyle(color, 1);
            this.iconGfx.fillRect(iconLeft + gx * px, iconTop + gy * px, px, px);
        };

        // Horse (minimal silhouette)
        for (let gy = 4; gy <= 6; gy++) {
            f(2, gy, brown);
            f(3, gy, brown);
            f(4, gy, brown);
            if (gy === 5) f(5, gy, brown);
        }
        // Head
        f(1, 3, brown);
        f(2, 3, brown);
        f(1, 4, brown);
        f(2, 4, brown);
        // Tail
        f(5, 4, brown);
        f(6, 5, brown);

        // Legs
        f(2, 6, brown);
        f(3, 6, brown);
        f(5, 6, brown);

        // Jockey
        f(3, 1, brown);
        f(2, 2, brown);
        f(3, 2, brown);
        f(4, 2, brown);

        // Torso
        f(3, 3, brown);
        f(3, 4, brown);

        // Pants (white)
        f(3, 5, pants);
        f(4, 5, pants);

        // Arms/hand hint
        f(2, 4, brown);
        f(4, 4, brown);
    }

    darken(color, factor) {
        const c = Phaser.Display.Color.IntegerToColor(color);
        const r = Phaser.Math.Clamp(Math.round(c.red * factor), 0, 255);
        const g = Phaser.Math.Clamp(Math.round(c.green * factor), 0, 255);
        const b = Phaser.Math.Clamp(Math.round(c.blue * factor), 0, 255);
        return Phaser.Display.Color.GetColor(r, g, b);
    }
}

// ========== Game Scene ==========
/** 전광판/DB용 닉네임(★ 접두 제거) */
function stripBoardNickname(name) {
    return String(name || '').replace(/^\s*★\s*/, '').trim() || 'Player';
}
function formatFinishTimeDisplay(sec) {
    if (sec == null || Number.isNaN(sec)) return '--';
    return Number(sec).toFixed(2) + 's';
}

class GameScene extends Phaser.Scene {
    constructor() { super({ key: 'Game' }); }
    init(data) {
        this.players = (data && data.players) || window.gameState?.players || [];
        this.myColor = window.gameState?.myColor || 'red';
        this.socket = window.gameState?.socket;
        this.soloMode = !!(data && data.soloMode);
        this.raceId = (data && data.raceId) || null;
        // 서버에서 전달된 장애물 정의 (모든 유저 공통)
        this.obstacleDefs = (data && data.obstacles) || [];
        // 참가한 플레이어 색상 = 인간, 나머지 = 컴퓨터(AI) 자동 출발
        this.playerColors = new Set((this.players || []).map(p => p.color));
        // 점프 판정 구간 (px) – 장애물 앞에서만 점프 허용
        // 성공 범위를 조금 더 넓게 조정
        this.jumpMaxRange = 380;    // 이 거리 안에 들어오면 점프 시도 가능
        this.jumpSuccessFar = this.soloMode ? 330 : 300;  // 성공 상한 (solo는 조금 넓힘)
        this.jumpSuccessNear = this.soloMode ? 90 : 120;  // 성공 하한 (solo는 조금 넓힘)
        // 플레이어 입력 기반 스피드 HUD
        this.speed = 0;
        this.lastTapTime = 0;
        // 하이퍼올림픽식 연타 게이지(0~100): 연타로 상승, 시간 경과로 감소
        this.runGauge = 0;
        this.runGaugeMax = 100;
        this.runGaugeIncrement = 11;
        this.runGaugeDecayPerSec = 24;
        this.minJumpGauge = this.soloMode ? 30 : 60;
        // 순위 / 점수 HUD
        this.myRank = null;

        // 게임 씬 시작과 동시에 5초 카운트다운 후에 달리기 시작
        this.preStartSeconds = 5;
        this.preStart = true;
        this.jumpBlockedAfterFail = false;
        this.jumpFailTimePenalty = false;
        this.finishPenaltyDelayUntil = null;
        this.failOverlayYOffset = 0;
        this.failStripYOffset = 0;
        this.startGateSprite = null;
        this.raceBoardElapsedFrozen = null;
        this.playerHandledObstacleX = -9999;
        this.playerFailLockUntil = 0;
        this.aiJumpActionDurationMs = 520;
        this.aiFailActionDurationMs = 900;
        this.firstFinishAtMs = null;
        this.finishCountdownText = null;
    }
    create() {
        const scene = this;
        const { width, height } = scene.scale;
        const scaleY = height / 960;
        const FAIL_OVERLAY_DISPLAY_SCALE = 1.35;
        /** 가로 시트 실패: 최대 박스 = 오버레이 크기와 동일(1 초과 시 커짐) */
        const FAIL_STRIP_FIT_WIDTH_MUL = 1;
        const FAIL_STRIP_FIT_HEIGHT_MUL = 1;
        const FAIL_STRIP_Y_OFFSET = Math.round(4 * scaleY);
        this.failStripYOffset = FAIL_STRIP_Y_OFFSET;
        const fitStripFailSpriteToMax = (sprite, textureKey, maxW, maxH) => {
            if (!sprite || !scene.textures.exists(textureKey)) return;
            const img = scene.textures.get(textureKey).getSourceImage();
            const iw = img.naturalWidth || img.width;
            const ih = img.naturalHeight || img.height;
            if (iw < 1 || ih < 1) return;
            const s = Math.min(maxW / iw, maxH / ih);
            sprite.setScale(s);
        };
        const fitSpriteToBox = (sprite, maxW, maxH) => {
            if (!sprite) return;
            const frame = sprite.frame;
            const srcW = frame ? (frame.realWidth || frame.width || 0) : 0;
            const srcH = frame ? (frame.realHeight || frame.height || 0) : 0;
            if (srcW < 1 || srcH < 1 || maxW < 1 || maxH < 1) return;
            const ratio = Math.min(maxW / srcW, maxH / srcH);
            sprite.setDisplaySize(Math.max(1, Math.round(srcW * ratio)), Math.max(1, Math.round(srcH * ratio)));
        };
        const fitJumpSpriteToHorseBox = (sprite, targetW, targetH) => {
            if (!sprite) return;
            const frame = sprite.frame;
            const srcW = frame ? (frame.realWidth || frame.width || 0) : 0;
            const srcH = frame ? (frame.realHeight || frame.height || 0) : 0;
            if (srcW < 1 || srcH < 1 || targetW < 1 || targetH < 1) return;
            let ratio = targetH / srcH;
            const widthAtHeightLock = srcW * ratio;
            const minReadableW = targetW * 0.95;
            if (widthAtHeightLock < minReadableW) ratio = minReadableW / srcW;
            ratio *= 1.12;
            sprite.setDisplaySize(
                Math.max(1, Math.round(srcW * ratio)),
                Math.max(1, Math.round(srcH * ratio))
            );
        };
        const laneHeight = Math.round(100 * scaleY);
        // 대기(idle) / 달리기(run) / 점프·실패 애니 — 프레임 속도
        const HORSE_IDLE_FPS = 3;
        /** 서 있음(머리 숙임 등): 한 방향 루프면 앞으로 걷는 것처럼 보일 수 있어 yoyo+느린 속도 사용 */
        const HORSE_STAND_IDLE_FPS = 2;
        const HORSE_RUN_FPS = 9;
        /** 점프만 달리기보다 느리게 (프레임당 체류 시간↑) */
        const HORSE_JUMP_FPS = 5;
        const FAIL_BLUE_FRAME_COUNT = 10;
        const FAIL_BLUE_ANIM_SEC = 3;
        const FAIL_GREEN_FRAME_COUNT = 10;
        const FAIL_GREEN_ANIM_SEC = 3;
        const FAIL_RED_FRAME_COUNT = 10;
        const FAIL_RED_ANIM_SEC = 3;
        const FAIL_YELLOW_FRAME_COUNT = 10;
        const FAIL_YELLOW_ANIM_SEC = 3;
        this.aiFailActionDurationMs = Math.round(
            Math.max(FAIL_BLUE_ANIM_SEC, FAIL_GREEN_ANIM_SEC, FAIL_RED_ANIM_SEC, FAIL_YELLOW_ANIM_SEC) * 1000
        );

        // 말 텍스처/애니 — horse_raw2 는 파랑 달리기 시트(6프레임) 기준 폴백 (너비 6배수 패딩으로 프레임 경계 정렬)
        if (scene.textures.exists('horse_raw2')) {
            const img = scene.textures.get('horse_raw2').getSourceImage();
            const w = img.width, h = img.height;
            if (w >= 50 && h >= 50) {
                const fc = 6;
                const paddedW = Math.ceil(w / fc) * fc;
                let fW, fH, frameCount;
                let sheetSource = img;
                if (paddedW !== w) {
                    const c = document.createElement('canvas');
                    c.width = paddedW;
                    c.height = h;
                    const x = c.getContext('2d');
                    x.clearRect(0, 0, paddedW, h);
                    x.drawImage(img, 0, 0);
                    sheetSource = c;
                }
                fW = paddedW / fc;
                fH = h;
                frameCount = fc;
                scene.textures.addSpriteSheet('horse_sheet2', sheetSource, { frameWidth: fW, frameHeight: fH });
                if (frameCount > 1 && !scene.anims.exists('run2')) {
                    scene.anims.create({
                        key: 'run2',
                        frames: scene.anims.generateFrameNumbers('horse_sheet2', { start: 0, end: frameCount - 1 }),
                        frameRate: 15,
                        repeat: -1
                    });
                }
            }
        }

        // ===== 달리기(런) 애니메이션 — 팀별 6프레임 시트(RUN_SPRITE_SHEETS) =====
        const RUN_FRAME_COUNT = 6;
        const addSixFrameRunFromRaw = (rawKey, sheetKey, animKey) => {
            if (!scene.textures.exists(rawKey)) return false;
            const img = scene.textures.get(rawKey).getSourceImage();
            const w = img.width, h = img.height;
            let fW, fH;
            const paddedW = Math.ceil(w / RUN_FRAME_COUNT) * RUN_FRAME_COUNT;
            let sheetSource = img;
            if (paddedW !== w) {
                const c = document.createElement('canvas');
                c.width = paddedW;
                c.height = h;
                const x = c.getContext('2d');
                x.clearRect(0, 0, paddedW, h);
                x.drawImage(img, 0, 0);
                sheetSource = c;
                fW = paddedW / RUN_FRAME_COUNT;
                fH = h;
            } else if (w % RUN_FRAME_COUNT === 0) {
                fW = Math.floor(w / RUN_FRAME_COUNT);
                fH = h;
            } else if (h % RUN_FRAME_COUNT === 0) {
                fW = w;
                fH = Math.floor(h / RUN_FRAME_COUNT);
            } else if (w % 3 === 0 && h % 2 === 0) {
                fW = Math.floor(w / 3);
                fH = Math.floor(h / 2);
            } else {
                fW = Math.max(1, Math.floor(w / RUN_FRAME_COUNT));
                fH = h;
            }
            if (!scene.textures.exists(sheetKey)) {
                scene.textures.addSpriteSheet(sheetKey, sheetSource, { frameWidth: fW, frameHeight: fH });
            }
            scene.anims.create({
                key: animKey,
                frames: scene.anims.generateFrameNumbers(sheetKey, { start: 0, end: 5 }),
                frameRate: HORSE_RUN_FPS,
                repeat: -1
            });
            return true;
        };
        COLOR_ORDER.forEach((color) => {
            const animKey = `run_${color}`;
            if (scene.anims.exists(animKey)) return;
            if (addSixFrameRunFromRaw(`run_${color}_sheet_raw`, `run_${color}_sheet`, animKey)) return;
            const frames = [
                { key: `run_${color}_1` },
                { key: `run_${color}_2` },
                { key: `run_${color}_3` },
                { key: `run_${color}_4` },
            ];
            scene.anims.create({
                key: animKey,
                frames,
                frameRate: HORSE_RUN_FPS,
                repeat: -1
            });
        });

        // 점프: 4색 — 8프레임 가로 시트 (floor 너비/8 + 우측 크롭으로 프레임 경계 정렬)
        const JUMP_SHEET_FRAME_COUNT = 8;
        const registerEightFrameJumpSheet = (rawKey, sheetKey, animKey) => {
            if (!scene.textures.exists(rawKey) || scene.anims.exists(animKey)) return;
            const img = scene.textures.get(rawKey).getSourceImage();
            const w = img.width, h = img.height;
            if (w < 50 || h < 20) return;
            const fc = JUMP_SHEET_FRAME_COUNT;
            const paddedW = Math.ceil(w / fc) * fc;
            const fW = Math.max(1, Math.floor(paddedW / fc));
            let sheetSource = img;
            if (paddedW !== w) {
                const cnv = document.createElement('canvas');
                cnv.width = paddedW;
                cnv.height = h;
                const x = cnv.getContext('2d');
                x.clearRect(0, 0, paddedW, h);
                x.drawImage(img, 0, 0);
                sheetSource = cnv;
            }
            if (!scene.textures.exists(sheetKey)) {
                scene.textures.addSpriteSheet(sheetKey, sheetSource, { frameWidth: fW, frameHeight: h });
            }
            scene.anims.create({
                key: animKey,
                frames: scene.anims.generateFrameNumbers(sheetKey, { start: 0, end: fc - 1 }),
                frameRate: HORSE_JUMP_FPS,
                repeat: 0
            });
        };
        registerEightFrameJumpSheet('jump_blue_sheet_raw', 'jump_blue_sheet', 'jump_blue');
        registerEightFrameJumpSheet('jump_red_sheet_raw', 'jump_red_sheet', 'jump_red');
        registerEightFrameJumpSheet('jump_yellow_sheet_raw', 'jump_yellow_sheet', 'jump_yellow');
        registerEightFrameJumpSheet('jump_green_sheet_raw', 'jump_green_sheet', 'jump_green');

        // 실패: 가로 스트립 — 프레임마다 별도 캔버스 + NEAREST 필터
        // 너비가 프레임 수로 나눠떨어지지 않을 때 고정 floor(w/fc)로 자르면 프레임 경계가 밀려 옆 칸(다음 프레임 머리)이 섞여 보일 수 있음 → 남은 픽셀을 균등 분배하는 슬라이스 사용
        // 프레임 경계가 아트와 어긋나면 N번째 프레임 오른쪽에 N+1번 기수 머리가 비침 → 가터·오른쪽 추가 트림으로 제거
        const FAIL_STRIP_EDGE_GUTTER_PX = 8;
        const FAIL_EXTRA_INTER_FRAME_TRIM_PX = 4;
        const FAIL_FRAME_SAFE_PAD_PX = 2;
        const computeFailStripSlices = (totalW, frameCount) => {
            const slices = [];
            let acc = 0;
            for (let i = 0; i < frameCount; i++) {
                const fw = Math.floor((totalW - acc) / (frameCount - i));
                slices.push({ left: acc, width: fw });
                acc += fw;
            }
            return slices;
        };
        const applyNearestPixelFilter = (textureKey) => {
            if (!scene.textures.exists(textureKey)) return;
            const tex = scene.textures.get(textureKey);
            if (!tex || typeof tex.setFilter !== 'function') return;
            const mode =
                typeof Phaser.Textures.FilterMode !== 'undefined' &&
                Phaser.Textures.FilterMode.NEAREST !== undefined
                    ? Phaser.Textures.FilterMode.NEAREST
                    : 1;
            tex.setFilter(mode);
        };
        const registerFailStripCanvasFrames = (rawKey, frameKeyPrefix, animKey, frameCount, animSec) => {
            if (!scene.textures.exists(rawKey) || scene.anims.exists(animKey)) return;
            const img = scene.textures.get(rawKey).getSourceImage();
            const w = img.width, h = img.height;
            if (w < 50 || h < 20) return;
            const fc = frameCount;
            const slices = computeFailStripSlices(w, fc);
            const edgeGutter = FAIL_STRIP_EDGE_GUTTER_PX | 0;
            const extraTrim = FAIL_EXTRA_INTER_FRAME_TRIM_PX | 0;
            const innerSizes = [];
            for (let i = 0; i < fc; i++) {
                const sliceW = slices[i].width;
                const gL = edgeGutter > 0 && i > 0 ? edgeGutter : 0;
                const gR = edgeGutter > 0 && i < fc - 1 ? edgeGutter : 0;
                const trimR = i < fc - 1 ? extraTrim : 0;
                innerSizes.push(Math.max(1, sliceW - gL - gR - trimR));
            }
            const maxInnerW = Math.max(1, ...innerSizes);
            const safePad = FAIL_FRAME_SAFE_PAD_PX | 0;
            for (let i = 0; i < fc; i++) {
                const sx0 = slices[i].left;
                const sliceW = slices[i].width;
                if (sliceW < 1) break;
                const gL = edgeGutter > 0 && i > 0 ? edgeGutter : 0;
                const gR = edgeGutter > 0 && i < fc - 1 ? edgeGutter : 0;
                let drawW = sliceW - gL - gR;
                if (i < fc - 1) drawW = Math.max(1, drawW - extraTrim);
                if (drawW < 1) drawW = 1;
                const sx = sx0 + gL;
                const cnv = document.createElement('canvas');
                cnv.width = maxInnerW + safePad * 2;
                cnv.height = h;
                const ctx = cnv.getContext('2d');
                ctx.imageSmoothingEnabled = false;
                ctx.clearRect(0, 0, cnv.width, h);
                ctx.drawImage(img, sx, 0, drawW, h, safePad, 0, drawW, h);
                const key = `${frameKeyPrefix}_${i}`;
                if (!scene.textures.exists(key)) scene.textures.addCanvas(key, cnv);
                applyNearestPixelFilter(key);
            }
            if (scene.textures.exists(`${frameKeyPrefix}_0`)) {
                scene.anims.create({
                    key: animKey,
                    frames: Array.from({ length: fc }, (_, i) => ({ key: `${frameKeyPrefix}_${i}` })),
                    frameRate: fc / animSec,
                    repeat: 0
                });
            }
        };
        registerFailStripCanvasFrames('fail_blue_sheet_raw', 'fail_blue_frame', 'fail_blue', FAIL_BLUE_FRAME_COUNT, FAIL_BLUE_ANIM_SEC);
        registerFailStripCanvasFrames('fail_green_sheet_raw', 'fail_green_frame', 'fail_green', FAIL_GREEN_FRAME_COUNT, FAIL_GREEN_ANIM_SEC);
        registerFailStripCanvasFrames('fail_red_sheet_raw', 'fail_red_frame', 'fail_red', FAIL_RED_FRAME_COUNT, FAIL_RED_ANIM_SEC);
        registerFailStripCanvasFrames('fail_yellow_sheet_raw', 'fail_yellow_frame', 'fail_yellow', FAIL_YELLOW_FRAME_COUNT, FAIL_YELLOW_ANIM_SEC);

        (function warnMissingFailAssets() {
            try {
                const dbg =
                    typeof window !== 'undefined' &&
                    (window.__HORSE_RACE_DEBUG_FAIL__ ||
                        (window.location &&
                            (window.location.hostname === 'localhost' ||
                                window.location.hostname === '127.0.0.1' ||
                                (window.location.search && window.location.search.indexOf('horseDebug=1') !== -1))));
                if (!dbg) return;
                const colors = ['blue', 'green', 'red', 'yellow'];
                const missing = [];
                colors.forEach((c) => {
                    const hasRaw = scene.textures.exists(`fail_${c}_sheet_raw`);
                    const hasFrame0 = scene.textures.exists(`fail_${c}_frame_0`);
                    const hasAnim = scene.anims.exists(`fail_${c}`);
                    if (!hasRaw || !hasFrame0 || !hasAnim) {
                        missing.push(`${c}(raw=${hasRaw} frame0=${hasFrame0} anim=${hasAnim})`);
                    }
                });
                if (missing.length) {
                    console.warn('[horse_race] 실패 연출 없는 색:', missing.join(', '));
                } else {
                    console.info('[horse_race] 실패 이미지/애니: blue·green·red·yellow 모두 OK');
                }
            } catch (e) { /* ignore */ }
        })();

        const fenceH = Math.round(10 * scaleY);
        const standH = Math.round(160 * scaleY);  // 관중 세로 축소
        const topSectionH = standH + fenceH;      // 이미지가 흰선까지 덮음
        const trackTop = topSectionH;
        // 트랙 배경이 아래로 조금 더 보이도록 높이 살짝 증가
        const trackExtraH = Math.round(80 * scaleY);
        const trackH = Math.round(450 * scaleY) + trackExtraH;
        const stripeH = Math.round(45 * scaleY);
        const startY = trackTop + Math.round(40 * scaleY);
        // 말·장애물 등을 화면에서 조금 더 아래로 내려 배치하기 위한 추가 오프셋
        const entityOffsetY = Math.round(40 * scaleY);
        if (this.soloMode) {
            this.crowdMembers = [];
            this.crowdContainer = null;
            this.fenceRect = null;
            const worldW = TARGET_DISTANCE + width;
            const skyH = Math.max(90, Math.round(trackTop));
            scene.add.rectangle(worldW / 2, skyH * 0.5, worldW, skyH, 0x90caf9).setDepth(-22);
            scene.add.rectangle(worldW / 2, skyH * 0.78, worldW, Math.round(skyH * 0.45), 0xb3e5fc, 0.65).setDepth(-21);
            const greenMountTex = 'solo_green_mountain_tex';
            if (!scene.textures.exists(greenMountTex)) {
                const mw = 768, mh = 220;
                const mg = scene.make.graphics({ x: 0, y: 0, add: false });
                mg.fillStyle(0x66bb6a, 1);
                for (let i = 0; i < 7; i++) {
                    const bx = i * 120 - 120;
                    const peakY = Phaser.Math.Between(35, 135);
                    mg.beginPath();
                    mg.moveTo(bx, mh);
                    mg.lineTo(bx + Phaser.Math.Between(70, 110), peakY);
                    mg.lineTo(bx + Phaser.Math.Between(180, 250), mh);
                    mg.closePath();
                    mg.fillPath();
                }
                mg.fillStyle(0x4caf50, 0.45);
                for (let i = 0; i < 6; i++) {
                    const bx = i * 130 - 80;
                    const peakY = Phaser.Math.Between(60, 150);
                    mg.beginPath();
                    mg.moveTo(bx, mh);
                    mg.lineTo(bx + Phaser.Math.Between(55, 95), peakY);
                    mg.lineTo(bx + Phaser.Math.Between(150, 230), mh);
                    mg.closePath();
                    mg.fillPath();
                }
                mg.generateTexture(greenMountTex, mw, mh);
                mg.destroy();
            }
            scene.add.tileSprite(0, Math.round(skyH * 0.20), worldW, Math.round(skyH * 0.95), greenMountTex)
                .setOrigin(0, 0)
                .setScrollFactor(0.12)
                .setDepth(-19);
            scene.add.tileSprite(0, Math.round(skyH * 0.42), worldW, Math.round(skyH * 0.70), greenMountTex)
                .setOrigin(0, 0)
                .setScrollFactor(0.22)
                .setDepth(-18);
            if (scene.textures.exists('single_track')) {
                this.trackTile = scene.add.tileSprite(0, trackTop, worldW, trackH, 'single_track')
                    .setOrigin(0, 0)
                    .setDepth(-10);
            } else {
                scene.add.rectangle(worldW / 2, trackTop + trackH / 2, worldW, trackH, 0x8d6e63).setDepth(-10);
                this.trackTile = null;
            }
            scene.add.rectangle(worldW / 2, trackTop + Math.round(trackH * 0.08), worldW, Math.round(trackH * 0.16), 0xffffff, 0.08).setDepth(-9.7);
            scene.add.rectangle(worldW / 2, trackTop + Math.round(trackH * 0.92), worldW, Math.round(trackH * 0.16), 0x1b5e20, 0.10).setDepth(-9.6);
        } else {
            scene.add.rectangle(width / 2, topSectionH / 2, width, topSectionH, 0x222222).setScrollFactor(0).setDepth(-15);
            scene.add.rectangle(width / 2, Math.round(topSectionH * 0.34), width, Math.max(10, Math.round(24 * scaleY)), 0x2b3a42).setScrollFactor(0).setDepth(-13);
            scene.add.rectangle(width / 2, Math.round(topSectionH * 0.53), width, Math.max(10, Math.round(22 * scaleY)), 0x30444f).setScrollFactor(0).setDepth(-13);
            scene.add.rectangle(width / 2, Math.round(topSectionH * 0.70), width, Math.max(10, Math.round(20 * scaleY)), 0x2f3f47).setScrollFactor(0).setDepth(-13);
            const crowdAtlasKey = 'crowd_grandstand_sheet';
            const crowdVariants = 32;
            const frameW = 14;
            const frameH = 18;
            if (!scene.textures.exists(crowdAtlasKey)) {
                const atlasCanvas = document.createElement('canvas');
                atlasCanvas.width = frameW * crowdVariants;
                atlasCanvas.height = frameH;
                const ctx = atlasCanvas.getContext('2d');
                ctx.imageSmoothingEnabled = false;
                const skin = [0xf4c7a1, 0xe0ac86, 0xd08b5b, 0xffccbc, 0xc68642];
                const hair = [0x3e2723, 0x6d4c41, 0x212121, 0x8d6e63, 0xfbc02d, 0x5d4037, 0x01579b];
                const shirts = [0x1e88e5, 0x43a047, 0xe53935, 0xffb300, 0x8e24aa, 0x00acc1, 0xd500f9, 0x00e676, 0xff6d00, 0x7c4dff];
                const pants = [0x263238, 0x37474f, 0x1a237e, 0x4e342e, 0x1b5e20];
                for (let i = 0; i < crowdVariants; i++) {
                    const ox = i * frameW;
                    const skinCol = skin[i % skin.length];
                    const hairCol = hair[(i * 2) % hair.length];
                    const shirtCol = shirts[(i * 3) % shirts.length];
                    const shirtAccent = shirts[(i * 3 + 2) % shirts.length];
                    const pantsCol = pants[i % pants.length];
                    const pose = i % 4;
                    const px = (x, y, c) => {
                        if (x < 0 || x >= frameW || y < 0 || y >= frameH) return;
                        ctx.fillStyle = '#' + c.toString(16).padStart(6, '0');
                        ctx.fillRect(ox + x, y, 1, 1);
                    };
                    for (let x = 4; x <= 9; x++) { px(x, 0, hairCol); px(x, 1, hairCol); }
                    px(3, 2, hairCol); px(10, 2, hairCol);
                    if (pose === 3) { for (let x = 3; x <= 9; x++) px(x, 2, 0x212121); px(4, 1, 0x212121); px(8, 1, 0x212121); }
                    for (let y = 3; y <= 5; y++) for (let x = 4; x <= 8; x++) px(x, y, skinCol);
                    px(5, 4, 0x2e2e2e); px(7, 4, 0x2e2e2e);
                    for (let y = 6; y <= 10; y++) for (let x = 3; x <= 9; x++) px(x, y, shirtCol);
                    for (let y = 7; y <= 9; y++) px(6, y, shirtAccent);
                    if (pose === 2) {
                        px(0, 3, skinCol); px(1, 2, skinCol); px(2, 1, skinCol);
                        px(13, 3, skinCol); px(12, 2, skinCol); px(11, 1, skinCol);
                    } else if (pose === 1) {
                        px(1, 4, skinCol); px(1, 3, skinCol); px(2, 2, skinCol);
                        px(11, 8, skinCol); px(11, 9, shirtCol); px(11, 10, shirtCol);
                    } else {
                        px(2, 8, skinCol); px(2, 9, shirtCol); px(3, 10, shirtCol);
                        px(11, 8, skinCol); px(11, 9, shirtCol); px(10, 10, shirtCol);
                    }
                    for (let y = 11; y <= 15; y++) for (let x = 4; x <= 8; x++) px(x, y, pantsCol);
                    for (let x = 2; x <= 11; x++) px(x, 16, 0x101010);
                    px(5, 17, 0x263238); px(6, 17, 0x263238); px(7, 17, 0x263238);
                    if (i % 7 === 0) { px(0, 5, 0xffffff); px(0, 6, 0xe53935); }
                }
                scene.textures.addSpriteSheet(crowdAtlasKey, atlasCanvas, { frameWidth: frameW, frameHeight: frameH });
            }
            const crowdMargin = Math.round(10 * scaleY);
            const crowdLeft = crowdMargin;
            const crowdRight = width - crowdMargin;
            const crowdWidth = Math.max(40, crowdRight - crowdLeft);
            scene.add.rectangle(width / 2, Math.round(topSectionH * 0.48), width - crowdMargin * 2, topSectionH - Math.round(6 * scaleY), 0x1a237e, 0.35)
                .setScrollFactor(0).setDepth(-12.6);
            this.crowdContainer = scene.add.container(0, 0).setScrollFactor(0).setDepth(-12);
            this.crowdMembers = [];
            const rows = 4;
            const cols = Math.max(10, Math.floor(crowdWidth / Math.max(18, Math.round(22 * scaleY))));
            const yStart = Math.round(8 * scaleY);
            const yEnd = standH - Math.round(10 * scaleY);
            const baseSpriteScale = Math.max(2.0, scaleY * 2.15);
            for (let row = 0; row < rows; row++) {
                const t = rows <= 1 ? 0 : row / (rows - 1);
                const baseY = Math.round(Phaser.Math.Linear(yStart, yEnd, t));
                const rowScale = 0.86 + t * 0.22;
                scene.add.rectangle(width / 2, baseY + Math.round(4 * scaleY), width - crowdMargin * 2, Math.max(4, Math.round(5 * scaleY)), 0x0d1642, 0.55)
                    .setScrollFactor(0).setDepth(-12.55);
                for (let col = 0; col < cols; col++) {
                    const baseX = Math.round(crowdLeft + (col + 0.5) * (crowdWidth / cols) + Phaser.Math.Between(-3, 3));
                    const frame = Phaser.Math.Between(0, crowdVariants - 1);
                    const spr = scene.add.sprite(baseX, baseY, crowdAtlasKey, frame)
                        .setOrigin(0.5, 1)
                        .setScale(baseSpriteScale * rowScale)
                        .setFlipX(((row + col) % 2) === 0);
                    if (spr.setRoundPixels) spr.setRoundPixels(true);
                    this.crowdContainer.add(spr);
                    this.crowdMembers.push({
                        spr,
                        baseY,
                        amp: Phaser.Math.Between(1, 3),
                        speed: Phaser.Math.FloatBetween(0.0035, 0.008),
                        phase: Phaser.Math.FloatBetween(0, Math.PI * 2)
                    });
                }
            }
            this.fenceRect = scene.add.rectangle(scene.scale.width / 2, standH + fenceH / 2, width + 100, fenceH, 0xffffff).setOrigin(0.5).setScrollFactor(0).setDepth(-11);
            if (scene.textures.exists('track_tex')) {
                const trackTile = scene.add.tileSprite(0, trackTop, TARGET_DISTANCE + width, trackH, 'track_tex');
                trackTile.setOrigin(0).setDepth(-10);
                trackTile.setTileScale(1, 2.1);
                this.trackTile = trackTile;
            } else {
                scene.add.rectangle(0, trackTop, 10000, trackH, 0x8d6e63).setOrigin(0).setDepth(-10);
            }
            for (let i = 0; i < 4; i++) {
                const y = startY + i * laneHeight;
                scene.add.rectangle(150, y + Math.round(50 * scaleY), 15, Math.round(80 * scaleY), 0xbdc3c7).setDepth(5);
            }
            const finishLineX = TARGET_DISTANCE;
            const trackBottomY = trackTop + trackH;
            {
                let y = trackTop;
                let stripeIndex = 0;
                while (y < trackBottomY - 0.5) {
                    const segH = Math.min(stripeH, trackBottomY - y);
                    const c1 = stripeIndex % 2 === 0 ? 0xffffff : 0x000000;
                    const c2 = stripeIndex % 2 === 0 ? 0x000000 : 0xffffff;
                    scene.add.rectangle(finishLineX, y, 40, segH, c1).setOrigin(0, 0).setDepth(-2);
                    scene.add.rectangle(finishLineX + 40, y, 40, segH, c2).setOrigin(0, 0).setDepth(-2);
                    y += segH;
                    stripeIndex++;
                }
            }
        }

        // ===== 출발 전 5초 카운트다운 + 대기(아이들) 말 이미지 =====
        // 양수: idle 말을 왼쪽으로 밀고, 게이트 PNG는 그 오른쪽에 둠 (겹침 방지)
        this.waitingShiftX = Math.round(92 * scaleY);

        // 대기(아이들) 애니 — 팀별 8프레임 시트 (너비가 8로 안 나누어떨어지면 투명 패딩으로 프레임 경계 정렬)
        const addIdleStandSheetFromRaw = (rawKey, sheetKey, animKey) => {
            if (!scene.textures.exists(rawKey)) return false;
            const img = scene.textures.get(rawKey).getSourceImage();
            const w = img.width, h = img.height;
            const paddedW = Math.ceil(w / IDLE_STAND_FRAMES) * IDLE_STAND_FRAMES;
            let fW, fH;
            let sheetSource = img;
            if (paddedW !== w) {
                const c = document.createElement('canvas');
                c.width = paddedW;
                c.height = h;
                const x = c.getContext('2d');
                x.clearRect(0, 0, paddedW, h);
                x.drawImage(img, 0, 0);
                sheetSource = c;
                fW = paddedW / IDLE_STAND_FRAMES;
                fH = h;
            } else if (w % IDLE_STAND_FRAMES === 0) {
                fW = Math.floor(w / IDLE_STAND_FRAMES);
                fH = h;
            } else if (h % IDLE_STAND_FRAMES === 0) {
                fW = w;
                fH = Math.floor(h / IDLE_STAND_FRAMES);
            } else {
                fW = Math.max(1, Math.floor(w / IDLE_STAND_FRAMES));
                fH = h;
            }
            if (!scene.textures.exists(sheetKey)) {
                scene.textures.addSpriteSheet(sheetKey, sheetSource, { frameWidth: fW, frameHeight: fH });
            }
            scene.anims.create({
                key: animKey,
                frames: scene.anims.generateFrameNumbers(sheetKey, { start: 0, end: IDLE_STAND_FRAMES - 1 }),
                frameRate: HORSE_STAND_IDLE_FPS,
                repeat: -1,
                yoyo: true
            });
            return true;
        };
        COLOR_ORDER.forEach((color) => {
            const animKey = `idle_${color}`;
            if (scene.anims.exists(animKey)) return;
            addIdleStandSheetFromRaw(`idle_${color}_sheet_raw`, `idle_${color}_sheet`, animKey);
        });

        if (this.preStartSeconds > 0) {
            const countdownText = scene.add.text(
                width / 2,
                trackTop + Math.round(trackH * 0.20),
                `${this.preStartSeconds}초`,
                {
                    fontSize: Math.round(Math.min(width, height) * 0.10) + 'px',
                    fill: '#ffeb3b',
                    fontStyle: 'bold',
                    stroke: '#000000',
                    strokeThickness: 6,
                    align: 'center'
                }
            ).setOrigin(0.5).setDepth(3000);

            let sec = this.preStartSeconds;
            scene.time.addEvent({
                delay: 1000,
                repeat: this.preStartSeconds - 1,
                callback: () => {
                    sec--;
                    if (sec > 0) countdownText.setText(`${sec}초`);
                }
            });

            scene.time.delayedCall(this.preStartSeconds * 1000, () => {
                this.preStart = false;
                this.raceStartAt = this.time.now || 0;
                this.raceBoardElapsedFrozen = null;
                countdownText.setVisible(false);
                const sg = this.startGateSprite;
                if (sg && sg.active) {
                    if (scene.textures.exists('gate_half_open')) {
                        sg.setTexture('gate_half_open');
                        scene.time.delayedCall(280, () => {
                            if (!this.startGateSprite || !this.startGateSprite.active) return;
                            if (scene.textures.exists('gate_open')) this.startGateSprite.setTexture('gate_open');
                        });
                    }
                }
                const gateForFade = this.startGateSprite;
                if (gateForFade && gateForFade.active) {
                    gateForFade.setAlpha(1);
                    scene.tweens.add({
                        targets: gateForFade,
                        alpha: 0,
                        duration: 600,
                        ease: 'Sine.Out',
                        onComplete: () => {
                            if (this.startGateSprite && this.startGateSprite.active) {
                                try {
                                    this.startGateSprite.destroy();
                                } catch (e) { /* ignore */ }
                            }
                            this.startGateSprite = null;
                            if (this.setRaceBoardVisible) this.setRaceBoardVisible(true);
                        }
                    });
                } else {
                    if (this.setRaceBoardVisible) this.setRaceBoardVisible(true);
                }
            });
        }

        const horseSize = Math.round(50 * scaleY);
        // 대기(idle) / 달리기(run) 말: 동일한 화면 크기(표시 높이 기준 + idle 비율로 너비)
        const horseWFallback = Math.round(48 * scaleY);
        const horseHFallback = Math.round(36 * scaleY);
        // update()에서도 사용할 수 있도록 인스턴스에 저장
        this.horseSize = horseSize;
        this.horsePrevX = [];
        this.playerIdleDisplayW = null;
        this.playerIdleDisplayH = null;
        this.playerRunDisplayW = null;
        this.playerRunDisplayH = null;
        this.aiJumpSprites = [];
        this.aiFailSprites = [];
        // 말 4마리: 달리기는 팀별 run_*_sheet (RUN_SPRITE_SHEETS)
        this.horses = [];
        this.horsesIdle = [];
        const horseColors = [0xe53935, 0x1e88e5, 0x43a047, 0xfdd835];
        for (let idx = 0; idx < 4; idx++) {
            // 2~4레인 기본 보정(2번째~4번째 말 살짝 위)
            // 3/4번째 말은 추가로 약간 더 위로(요청 반영)
            const extraUpFor3And4 = Math.round(6 * scaleY);
            const laneUpOffsetBase = (idx === 3)
                ? Math.round(18 * scaleY)
                : (idx >= 1 ? Math.round(10 * scaleY) : 0);
            const laneUpOffset = (idx >= 2) ? (laneUpOffsetBase + extraUpFor3And4) : laneUpOffsetBase;
            const y = startY + idx * laneHeight + horseSize + entityOffsetY - laneUpOffset;
            const colorKey = COLOR_ORDER[idx];
            const idleRawKey = `idle_${colorKey}_sheet_raw`;
            const idleSheetKey = `idle_${colorKey}_sheet`;
            let targetH = Math.round(horseSize * 1.35);
            let targetW = horseWFallback;
            if (scene.textures.exists(idleRawKey)) {
                const img = scene.textures.get(idleRawKey).getSourceImage();
                const iw = img.naturalWidth || img.width || 1;
                const ih = img.naturalHeight || img.height || 1;
                const frameW = Math.ceil(iw / IDLE_STAND_FRAMES);
                targetW = Math.max(1, Math.round(targetH * (frameW / ih)));
            } else {
                targetH = horseHFallback;
                targetW = horseWFallback;
            }

            // 말 이미지 표시 배율: 우리 약속 기준 100 → 150 이면 1.5배 (idle·run 동일 배율)
            const horseDisplayScale = 1.5;
            targetW = Math.max(1, Math.round(targetW * horseDisplayScale));
            targetH = Math.max(1, Math.round(targetH * horseDisplayScale));

            // 달리기(run) 말: 대기(idle)와 동일 표시 크기 (스프라이트 시트 동일 프레임 크기 전제)
            const runDisplayW = targetW;
            const runDisplayH = targetH;

            let h;
            const runSheetKey = `run_${colorKey}_sheet`;
            if (scene.textures.exists(runSheetKey)) {
                h = scene.physics.add.sprite(250, y, runSheetKey, 0);
                if (h.setRoundPixels) h.setRoundPixels(true);
                h.setScale(1);
                h.setDisplaySize(runDisplayW, runDisplayH);
            } else if (scene.textures.exists('horse_sheet2')) {
                h = scene.physics.add.sprite(250, y, 'horse_sheet2', 0);
                if (h.setRoundPixels) h.setRoundPixels(true);
                h.setScale(1);
                h.setDisplaySize(runDisplayW, runDisplayH);
            } else {
                h = scene.add.rectangle(250, y, runDisplayW, runDisplayH, horseColors[idx]);
                scene.physics.add.existing(h, true);
            }
            // lane 정보를 데이터로 저장해 두면 장애물 판정 등에 활용 가능
            // lastMoveTime: 마지막으로 x가 변한 시간(정지/달리기 판정용)
            // handledObstacleX: 마지막으로 처리한 장애물 X (AI 점프/실패 중복 방지용)
            h.setDepth(10).setData({
                color: colorKey,
                finished: false,
                lane: idx,
                lastMoveTime: 0,
                handledObstacleX: -9999,
                aiSlowUntil: 0
            });
            this.horses.push(h);
            this.horsePrevX[idx] = h.x;
            // 대기(아이들) 말 스프라이트: run 말은 숨기고 idle 표시 (idle·run 표시 크기 동일)
            const initialShiftX = this.preStart ? this.waitingShiftX : 0;
            const idleSprite = scene.textures.exists(idleSheetKey)
                ? scene.add.sprite(h.x - initialShiftX, h.y, idleSheetKey, 0).setDepth(h.depth - 1)
                : scene.add.sprite(h.x - initialShiftX, h.y, runSheetKey, 0).setDepth(h.depth - 1);
            if (idleSprite.setRoundPixels) idleSprite.setRoundPixels(true);
            idleSprite.setDisplaySize(targetW, targetH);
            idleSprite.setVisible(true);
            const idleAnimKey = `idle_${colorKey}`;
            if (scene.anims.exists(idleAnimKey)) idleSprite.play(idleAnimKey);

            if (colorKey === this.myColor) {
                this.playerIdleDisplayW = targetW;
                this.playerIdleDisplayH = targetH;
                this.playerRunDisplayW = runDisplayW;
                this.playerRunDisplayH = runDisplayH;
            }

            this.horsesIdle[idx] = idleSprite;

            // AI 전용 점프/실패 스프라이트(색상별 5프레임 애니 재사용)
            const aiJumpKey = `jump_${colorKey}`;
            const aiFailKey = `fail_${colorKey}`;
            let jumpTexForSprite = '';
            let jumpFrameForSprite = undefined;
            if (colorKey === 'blue' && scene.textures.exists('jump_blue_sheet')) {
                jumpTexForSprite = 'jump_blue_sheet';
                jumpFrameForSprite = 0;
            } else if (colorKey === 'red' && scene.textures.exists('jump_red_sheet')) {
                jumpTexForSprite = 'jump_red_sheet';
                jumpFrameForSprite = 0;
            } else if (colorKey === 'yellow' && scene.textures.exists('jump_yellow_sheet')) {
                jumpTexForSprite = 'jump_yellow_sheet';
                jumpFrameForSprite = 0;
            } else if (colorKey === 'green' && scene.textures.exists('jump_green_sheet')) {
                jumpTexForSprite = 'jump_green_sheet';
                jumpFrameForSprite = 0;
            }
            if (scene.textures.exists(jumpTexForSprite) && scene.anims.exists(aiJumpKey)) {
                this.aiJumpSprites[idx] = scene.add.sprite(h.x, h.y, jumpTexForSprite, jumpFrameForSprite)
                    .setDepth(h.depth + 1)
                    .setVisible(false);
                fitJumpSpriteToHorseBox(this.aiJumpSprites[idx], targetW, targetH);
                if (this.aiJumpSprites[idx].setRoundPixels) this.aiJumpSprites[idx].setRoundPixels(true);
            } else {
                this.aiJumpSprites[idx] = null;
            }
            let failTexForSprite = '';
            let failFrameForSprite = undefined;
            if (colorKey === 'blue' && scene.textures.exists('fail_blue_frame_0')) {
                failTexForSprite = 'fail_blue_frame_0';
                failFrameForSprite = undefined;
            } else if (colorKey === 'green' && scene.textures.exists('fail_green_frame_0')) {
                failTexForSprite = 'fail_green_frame_0';
                failFrameForSprite = undefined;
            } else if (colorKey === 'red' && scene.textures.exists('fail_red_frame_0')) {
                failTexForSprite = 'fail_red_frame_0';
                failFrameForSprite = undefined;
            } else if (colorKey === 'yellow' && scene.textures.exists('fail_yellow_frame_0')) {
                failTexForSprite = 'fail_yellow_frame_0';
                failFrameForSprite = undefined;
            }
            if (scene.textures.exists(failTexForSprite) && scene.anims.exists(aiFailKey)) {
                const aiFailW = Math.max(1, Math.round(targetW * FAIL_OVERLAY_DISPLAY_SCALE));
                const aiFailH = Math.max(1, Math.round(targetH * FAIL_OVERLAY_DISPLAY_SCALE));
                const isStripFail = true;
                const yFail = h.y + (isStripFail ? FAIL_STRIP_Y_OFFSET : 0);
                this.aiFailSprites[idx] = scene.add.sprite(h.x, yFail, failTexForSprite, failFrameForSprite)
                    .setDepth(h.depth + 2)
                    .setVisible(false);
                if (isStripFail) {
                    fitStripFailSpriteToMax(
                        this.aiFailSprites[idx],
                        failTexForSprite,
                        aiFailW * FAIL_STRIP_FIT_WIDTH_MUL,
                        aiFailH * FAIL_STRIP_FIT_HEIGHT_MUL
                    );
                } else {
                    this.aiFailSprites[idx].setDisplaySize(aiFailW, aiFailH);
                }
                if (this.aiFailSprites[idx].setRoundPixels) this.aiFailSprites[idx].setRoundPixels(true);
            } else {
                this.aiFailSprites[idx] = null;
            }

            if (h.anims) h.anims.stop();
            h.setVisible(false);
            if (this.soloMode && colorKey !== this.myColor) {
                h.setData('disabled', true);
                h.setData('finished', true);
                h.setVisible(false);
                idleSprite.setVisible(false);
                if (idleSprite.anims) idleSprite.anims.stop();
                if (this.aiJumpSprites[idx]) this.aiJumpSprites[idx].setVisible(false);
                if (this.aiFailSprites[idx]) this.aiFailSprites[idx].setVisible(false);
            }
        }

        if (!this.soloMode) {
            const gateNatW = 413;
            const gateNatH = 604;
            const gateLaneTop = startY + Math.round(laneHeight * 0.06);
            const gateLaneBottom = startY + 4 * laneHeight - Math.round(laneHeight * 0.05);
            const gateH = Math.max(88, gateLaneBottom - gateLaneTop);
            const GATE_DISPLAY_MUL = 1.5;
            const gateScale = (gateH / gateNatH) * GATE_DISPLAY_MUL;
            const gateDisplayW = gateNatW * gateScale;
            const gateClear = Math.round(2 * scaleY);
            const GATE_NUDGE_Y = Math.round(36 * scaleY);
            const gateBottomY = gateLaneBottom + GATE_NUDGE_Y;

            let gateLeftX = null;
            if (this.horsesIdle && this.horsesIdle.length) {
                let maxRight = -Infinity;
                this.horsesIdle.forEach((idle) => {
                    if (!idle) return;
                    const rb = idle.getBounds();
                    if (rb && rb.right > maxRight) maxRight = rb.right;
                });
                if (maxRight > -Infinity) gateLeftX = maxRight + gateClear;
            }
            if (gateLeftX == null && this.horses && this.horses[0]) {
                const h0 = this.horses[0];
                const shift = this.preStart ? this.waitingShiftX : 0;
                const hw = h0.displayWidth || Math.round(72 * scaleY);
                gateLeftX = (h0.x - shift) + hw * 0.5 + gateClear;
            }
            if (gateLeftX == null) {
                const idleCenterX = 250 - this.waitingShiftX;
                gateLeftX = idleCenterX + Math.round(56 * scaleY) + gateClear;
            }
            const GATE_STALL_FRONT_FROM_LEFT = 0.42;
            const gateCenterX =
                gateLeftX + gateDisplayW * (0.5 - GATE_STALL_FRONT_FROM_LEFT);
            if (scene.textures.exists('gate_close')) {
                const gs = scene.add.image(gateCenterX, gateBottomY, 'gate_close')
                    .setOrigin(0.5, 1)
                    .setScale(gateScale)
                    .setDepth(10.5);
                if (gs.setRoundPixels) gs.setRoundPixels(true);
                this.startGateSprite = gs;
            }
        }

        this.player = this.horses[COLOR_ORDER.indexOf(this.myColor)];
        this.rivals = this.horses.filter((h, i) => COLOR_ORDER[i] !== this.myColor && !(h && h.getData('disabled')));

        // 플레이어 전용 점프/실패: 팀 색 5프레임 PNG 우선, 없으면 horse2 시트(4프레임) 폴백
        this.playerJumpSprite = null;
        this.playerFailSprite = null;
        this.playerJumpAnimKey = null;
        this.playerFailAnimKey = null;
        this.isJumping = false;
        this.isJumpingSuccess = false;
        this.isFailing = false;
        this.jumpStartX = 0;
        this.jumpTargetX = 0;
        this.jumpBaseY = 0;
        this.jumpElapsed = 0;
        // 점프 전체 시간을 조금 더 길게 해서 천천히 넘는 느낌
        this.jumpDuration = 700; // ms
        const pc = this.myColor;
        if (this.player) {
            const pw = this.player.displayWidth || Math.round(64 * scaleY);
            const ph = this.player.displayHeight || Math.round(48 * scaleY);
            // 점프·실패: 달리기(run)와 동일 표시 크기 (idle·run·target 동일값)
            const jumpFailW = this.playerRunDisplayW || this.playerIdleDisplayW || pw;
            const jumpFailH = this.playerRunDisplayH || this.playerIdleDisplayH || ph;
            const failDispW = Math.max(1, Math.round(jumpFailW * FAIL_OVERLAY_DISPLAY_SCALE));
            const failDispH = Math.max(1, Math.round(jumpFailH * FAIL_OVERLAY_DISPLAY_SCALE));
            if (pc === 'blue' && scene.textures.exists('jump_blue_sheet') && scene.anims.exists('jump_blue')) {
                this.playerJumpAnimKey = 'jump_blue';
                this.playerJumpSprite = scene.add.sprite(this.player.x, this.player.y, 'jump_blue_sheet', 0)
                    .setDepth(this.player.depth + 1)
                    .setVisible(false);
                fitJumpSpriteToHorseBox(this.playerJumpSprite, jumpFailW, jumpFailH);
                if (this.playerJumpSprite.setRoundPixels) this.playerJumpSprite.setRoundPixels(true);
            } else if (pc === 'red' && scene.textures.exists('jump_red_sheet') && scene.anims.exists('jump_red')) {
                this.playerJumpAnimKey = 'jump_red';
                this.playerJumpSprite = scene.add.sprite(this.player.x, this.player.y, 'jump_red_sheet', 0)
                    .setDepth(this.player.depth + 1)
                    .setVisible(false);
                fitJumpSpriteToHorseBox(this.playerJumpSprite, jumpFailW, jumpFailH);
                if (this.playerJumpSprite.setRoundPixels) this.playerJumpSprite.setRoundPixels(true);
            } else if (pc === 'yellow' && scene.textures.exists('jump_yellow_sheet') && scene.anims.exists('jump_yellow')) {
                this.playerJumpAnimKey = 'jump_yellow';
                this.playerJumpSprite = scene.add.sprite(this.player.x, this.player.y, 'jump_yellow_sheet', 0)
                    .setDepth(this.player.depth + 1)
                    .setVisible(false);
                fitJumpSpriteToHorseBox(this.playerJumpSprite, jumpFailW, jumpFailH);
                if (this.playerJumpSprite.setRoundPixels) this.playerJumpSprite.setRoundPixels(true);
            } else if (pc === 'green' && scene.textures.exists('jump_green_sheet') && scene.anims.exists('jump_green')) {
                this.playerJumpAnimKey = 'jump_green';
                this.playerJumpSprite = scene.add.sprite(this.player.x, this.player.y, 'jump_green_sheet', 0)
                    .setDepth(this.player.depth + 1)
                    .setVisible(false);
                fitJumpSpriteToHorseBox(this.playerJumpSprite, jumpFailW, jumpFailH);
                if (this.playerJumpSprite.setRoundPixels) this.playerJumpSprite.setRoundPixels(true);
            }
            if (pc === 'blue' && scene.textures.exists('fail_blue_frame_0') && scene.anims.exists('fail_blue')) {
                this.playerFailAnimKey = 'fail_blue';
                this.failOverlayYOffset = FAIL_STRIP_Y_OFFSET;
                this.playerFailSprite = scene.add.sprite(this.player.x, this.player.y + FAIL_STRIP_Y_OFFSET, 'fail_blue_frame_0')
                    .setDepth(this.player.depth + 2)
                    .setVisible(false);
                fitStripFailSpriteToMax(
                    this.playerFailSprite,
                    'fail_blue_frame_0',
                    failDispW * FAIL_STRIP_FIT_WIDTH_MUL,
                    failDispH * FAIL_STRIP_FIT_HEIGHT_MUL
                );
                if (this.playerFailSprite.setRoundPixels) this.playerFailSprite.setRoundPixels(true);
            } else if (pc === 'green' && scene.textures.exists('fail_green_frame_0') && scene.anims.exists('fail_green')) {
                this.playerFailAnimKey = 'fail_green';
                this.failOverlayYOffset = FAIL_STRIP_Y_OFFSET;
                this.playerFailSprite = scene.add.sprite(this.player.x, this.player.y + FAIL_STRIP_Y_OFFSET, 'fail_green_frame_0')
                    .setDepth(this.player.depth + 2)
                    .setVisible(false);
                fitStripFailSpriteToMax(
                    this.playerFailSprite,
                    'fail_green_frame_0',
                    failDispW * FAIL_STRIP_FIT_WIDTH_MUL,
                    failDispH * FAIL_STRIP_FIT_HEIGHT_MUL
                );
                if (this.playerFailSprite.setRoundPixels) this.playerFailSprite.setRoundPixels(true);
            } else if (pc === 'red' && scene.textures.exists('fail_red_frame_0') && scene.anims.exists('fail_red')) {
                this.playerFailAnimKey = 'fail_red';
                this.failOverlayYOffset = FAIL_STRIP_Y_OFFSET;
                this.playerFailSprite = scene.add.sprite(this.player.x, this.player.y + FAIL_STRIP_Y_OFFSET, 'fail_red_frame_0')
                    .setDepth(this.player.depth + 2)
                    .setVisible(false);
                fitStripFailSpriteToMax(
                    this.playerFailSprite,
                    'fail_red_frame_0',
                    failDispW * FAIL_STRIP_FIT_WIDTH_MUL,
                    failDispH * FAIL_STRIP_FIT_HEIGHT_MUL
                );
                if (this.playerFailSprite.setRoundPixels) this.playerFailSprite.setRoundPixels(true);
            } else if (pc === 'yellow' && scene.textures.exists('fail_yellow_frame_0') && scene.anims.exists('fail_yellow')) {
                this.playerFailAnimKey = 'fail_yellow';
                this.failOverlayYOffset = FAIL_STRIP_Y_OFFSET;
                this.playerFailSprite = scene.add.sprite(this.player.x, this.player.y + FAIL_STRIP_Y_OFFSET, 'fail_yellow_frame_0')
                    .setDepth(this.player.depth + 2)
                    .setVisible(false);
                fitStripFailSpriteToMax(
                    this.playerFailSprite,
                    'fail_yellow_frame_0',
                    failDispW * FAIL_STRIP_FIT_WIDTH_MUL,
                    failDispH * FAIL_STRIP_FIT_HEIGHT_MUL
                );
                if (this.playerFailSprite.setRoundPixels) this.playerFailSprite.setRoundPixels(true);
            }
        }

        // ===== 장애물 배치 =====
        this.obstacles = [];
        if (this.soloMode) {
            if (!scene.textures.exists('obstacle_raw')) {
                // obstacle 리소스가 없으면 solo 장애물은 생략
            } else {
            const img = scene.textures.get('obstacle_raw').getSourceImage();
            const sheetKey = 'obstacle_sheet';
            const frameW = Math.max(1, Math.floor(img.width / 2));
            const frameH = img.height;
            if (!scene.textures.exists(sheetKey)) {
                scene.textures.addSpriteSheet(sheetKey, img, { frameWidth: frameW, frameHeight: frameH });
            }
            this.soloObstacleGroup = scene.physics.add.staticGroup();
            const soloLane = Math.max(0, COLOR_ORDER.indexOf(this.myColor));
            const firstMin = 1600;
            const firstMax = Math.max(firstMin + 350, Math.floor(TARGET_DISTANCE * 0.30));
            const courseMax = TARGET_DISTANCE - 900;
            const soloDefs = [];
            let cursorX = firstMin + Math.floor(Math.random() * Math.max(1, firstMax - firstMin));
            while (cursorX <= courseMax && soloDefs.length < 7) {
                soloDefs.push({
                    type: Math.random() < 0.5 ? 'hurdle' : 'water',
                    x: cursorX
                });
                cursorX += Phaser.Math.Between(760, 1250);
            }
            soloDefs.forEach((def) => {
                const lane = soloLane;
                const extraUpFor3And4 = Math.round(6 * scaleY);
                const laneUpOffsetBase = (lane === 3)
                    ? Math.round(18 * scaleY)
                    : (lane >= 1 ? Math.round(10 * scaleY) : 0);
                const laneUpOffset = (lane >= 2) ? (laneUpOffsetBase + extraUpFor3And4) : laneUpOffsetBase;
                const laneCenterY = startY + lane * laneHeight + horseSize * 0.7 + entityOffsetY - laneUpOffset;
                const baseY = laneCenterY + horseSize * 0.28 + Math.round(16 * scaleY);
                const frameIndex = def.type === 'water' ? 1 : 0;
                const sprite = this.soloObstacleGroup.create(def.x, baseY, sheetKey, frameIndex).setDepth(6);
                const scaleFactor = def.type === 'water' ? (1.0 * 2 / 3) : (1.25 * 2 / 3);
                sprite.setScale(scaleY * scaleFactor);
                scene.add.ellipse(def.x, baseY + Math.round(18 * scaleY), Math.round(120 * scaleY), Math.round(24 * scaleY), 0x4e342e, 0.22)
                    .setDepth(5.8);
                if (sprite.refreshBody) sprite.refreshBody();
                const body = sprite.body;
