                if (body && body.setSize) body.setSize(sprite.displayWidth * 0.78, sprite.displayHeight * 0.78, true);
                const zoneH = Math.max(16, Math.round(laneHeight * 0.58));
                const zoneY = Math.round(baseY + Math.min(
                    Math.round(laneHeight * 0.08),
                    Math.round((sprite.displayHeight || laneHeight) * 0.12)
                ));
                const maxRange = this.jumpMaxRange || 380;
                const successFar = this.jumpSuccessFar || 300;
                const successNear = this.jumpSuccessNear || 120;
                const obstacleW = sprite.displayWidth || 120;
                const obstacleFrontX = def.x - obstacleW / 2;
                const orangeW = maxRange;
                const orangeCx = obstacleFrontX - maxRange / 2;
                const perfectW = Math.max(10, successFar - successNear);
                const perfectCx = obstacleFrontX - (successFar + successNear) / 2;
                const zoneOrange = null;
                const zonePerfect = scene.add.rectangle(perfectCx, zoneY, perfectW, zoneH, 0xd50000, 0.55)
                    .setOrigin(0, 0.5)
                    .setStrokeStyle(4, 0xff5252, 0.95)
                    .setDepth(6)
                    .setVisible(false);
                this.obstacles.push({ sprite, type: def.type, lane, zoneOrange, zonePerfect });
            });
            }
        } else if (this.obstacleDefs && this.obstacleDefs.length && scene.textures.exists('obstacle_raw')) {
            const img = scene.textures.get('obstacle_raw').getSourceImage();
            const sheetKey = 'obstacle_sheet';
            const frameW = Math.max(1, Math.floor(img.width / 2));
            const frameH = img.height;
            if (!scene.textures.exists(sheetKey)) {
                scene.textures.addSpriteSheet(sheetKey, img, { frameWidth: frameW, frameHeight: frameH });
            }
            this.obstacleDefs.forEach((def) => {
                const frameIndex = def.type === 'water' ? 1 : 0;
                for (let lane = 0; lane < 4; lane++) {
                    // 말과 동일하게 2~4레인 보정 + 3/4번째 말은 추가로 더 위
                    const extraUpFor3And4 = Math.round(6 * scaleY);
                    const laneUpOffsetBase = (lane === 3)
                        ? Math.round(18 * scaleY)
                        : (lane >= 1 ? Math.round(10 * scaleY) : 0);
                    const laneUpOffset = (lane >= 2) ? (laneUpOffsetBase + extraUpFor3And4) : laneUpOffsetBase;
                    const laneCenterY = startY + lane * laneHeight + horseSize * 0.7 + entityOffsetY - laneUpOffset;
                    // 허들은 이미지 크기를 조금 더 크게 하면서 Y는 조금 더 아래로
                    const hurdleDownExtra = Math.round(18 * scaleY);
                    // 물웅덩이도 약간 아래로
                    const waterDownExtra = Math.round(6 * scaleY);
                    // 물웅덩이: 현재 위치 기준, 살짝만 아래
                    // 허들: 트랙 쪽으로 더 많이, 그리고 추가로 조금 더 아래로 내려 배치
                    const baseY = (def.type === 'water')
                        ? laneCenterY + horseSize * 0.40 + waterDownExtra
                        : laneCenterY + horseSize * 0.30 + hurdleDownExtra;
                    const sprite = scene.add.sprite(def.x, baseY, sheetKey, frameIndex);
                    // 허들은 180도 뒤집어서(좌우 반전 느낌) 연출
                    if (def.type === 'hurdle') {
                        sprite.flipX = true;
                    }
                    // 허들과 물웅덩이 모두 원래의 2/3 크기로 축소
                    const scaleFactor = def.type === 'water' ? (1.0 * 2 / 3) : (1.25 * 2 / 3);
                    sprite.setDepth(6).setScale(scaleY * scaleFactor);
                    scene.physics.add.existing(sprite, true);
                    const body = sprite.body;
                    if (body && body.setSize) {
                        body.setSize(sprite.displayWidth * 0.8, sprite.displayHeight * 0.8, true);
                    }
                    const zoneH = Math.round(laneHeight * 0.42);
                    const zoneY = laneCenterY + laneHeight * 0.1
                        + (def.type === 'hurdle' ? hurdleDownExtra : 0)
                        + (def.type === 'water' ? waterDownExtra : 0);
                    const maxRange = this.jumpMaxRange || 380;
                    const successFar = this.jumpSuccessFar || 300;
                    const successNear = this.jumpSuccessNear || 120;
                    const obstacleW = sprite.displayWidth || frameW || 120;
                    const obstacleFrontX = def.x - obstacleW / 2;
                    const orangeW = maxRange;
                    const orangeCx = obstacleFrontX - maxRange / 2;
                    const perfectW = Math.max(10, successFar - successNear);
                    const perfectCx = obstacleFrontX - (successFar + successNear) / 2;
                    // 접근 시: 점프 가능 구간(주황 점멸) / 퍼펙트 구간(빨강 펄스)
                    const zoneOrange = null; // 노란 점프 가능 구간 제거 (빨간 구간만 표시)
                    const zonePerfect = scene.add.rectangle(perfectCx, zoneY, perfectW, zoneH, 0xd50000, 0.55)
                        .setStrokeStyle(4, 0xff5252, 0.95)
                        .setDepth(6)
                        .setVisible(false);

                    this.obstacles.push({ sprite, type: def.type, lane, zoneOrange, zonePerfect });
                }
            });
        }

        // 말 이름 표시: 말풍선 대신 투명 배경에 글자만, 말 후미 쪽에 배치
        const nameFontSize = Math.max(16, Math.round(22 * scaleY));
        let comNum = 0;
        this.nameLabels = [];
        const nameOffsetX = Math.round(-80 * scaleY);  // 말 뒤쪽
        const nameOffsetY = Math.round(-40 * scaleY);  // 말보다 약간 위
        COLOR_ORDER.forEach((color, idx) => {
            const p = (this.players || []).find((x) => x.color === color);
            const name = p ? p.nickname : 'com' + (++comNum);
            const horse = this.horses[idx];
            if (!horse || horse.getData('disabled')) return;
            const isMine = color === this.myColor;
            const displayName = isMine ? ('★ ' + name) : name;
            const label = scene.add.text(
                horse.x + nameOffsetX,
                horse.y + nameOffsetY,
                displayName,
                {
                    fontSize: nameFontSize + 'px',
                    fill: '#ffffff',
                    fontStyle: 'bold',
                    stroke: '#000000',
                    strokeThickness: 4
                }
            ).setOrigin(0.5, 0.5).setDepth(25);
            this.nameLabels.push({ label, name: displayName });
        });

        if (!this.soloMode) {
            const RACE_BOARD_BOX_SCALE = 0.7;
            const RACE_BOARD_V_SCALE = 2 / 3;
            const boardE = (n) => Math.max(1, Math.round(n * RACE_BOARD_BOX_SCALE));
            let boardWidth = Math.max(220, Math.min(Math.round(width * 0.78), Math.round(440 * scaleY)));
            boardWidth = Math.round(boardWidth * RACE_BOARD_BOX_SCALE);
            let boardH = Math.round(Math.max(110, Math.round(170 * scaleY)) * RACE_BOARD_V_SCALE);
            boardH = Math.round(boardH * RACE_BOARD_BOX_SCALE);
            const boardTopMargin = Math.round(8 * scaleY * RACE_BOARD_BOX_SCALE);
            const boardCx = width / 2;
            const boardCy = boardTopMargin + boardH / 2 + Math.round(24 * scaleY);
            const bx = boardCx - boardWidth / 2;
            const by = boardCy - boardH / 2;
            const raceBoardGfx = scene.add.graphics().setScrollFactor(0).setDepth(2100);
            raceBoardGfx.fillStyle(0x1a1a1a, 1);
            raceBoardGfx.fillRoundedRect(bx - boardE(6), by - boardE(6), boardWidth + boardE(12), boardH + boardE(12), boardE(12));
            raceBoardGfx.fillStyle(0xffb300, 0.45);
            raceBoardGfx.fillRoundedRect(bx - boardE(3), by - boardE(3), boardWidth + boardE(6), boardH + boardE(6), boardE(10));
            raceBoardGfx.fillStyle(0x0d1f12, 1);
            raceBoardGfx.fillRoundedRect(bx, by, boardWidth, boardH, boardE(8));
            raceBoardGfx.lineStyle(2, 0x4caf50, 0.55);
            raceBoardGfx.strokeRoundedRect(bx + boardE(3), by + boardE(3), boardWidth - boardE(6), boardH - boardE(6), boardE(6));
            raceBoardGfx.lineStyle(1, 0x81c784, 0.35);
            raceBoardGfx.strokeRoundedRect(bx + boardE(6), by + boardE(6), boardWidth - boardE(12), boardH - boardE(12), boardE(4));
            this.raceBoardGfx = raceBoardGfx;
            this.raceBoardCenterX = boardCx;
            this.raceBoardCenterY = boardCy;
            const boardPad = Math.round(12 * scaleY * RACE_BOARD_BOX_SCALE);
            this.raceBoardText = scene.add.text(
                boardCx,
                boardCy,
                '',
                {
                    fontSize: Math.max(11, Math.round(16 * scaleY * RACE_BOARD_BOX_SCALE)) + 'px',
                    color: '#e8f5e9',
                    fontStyle: 'bold',
                    align: 'center',
                    wordWrap: { width: Math.max(85, boardWidth - boardPad * 2) }
                }
            ).setOrigin(0.5, 0.5).setScrollFactor(0).setDepth(2101);
            this.setRaceBoardVisible = (visible) => {
                if (this.raceBoardGfx) this.raceBoardGfx.setVisible(!!visible);
                if (this.raceBoardText) this.raceBoardText.setVisible(!!visible);
            };
            this.setRaceBoardVisible(false);
        } else {
            this.raceBoardGfx = null;
            this.raceBoardText = null;
            this.setRaceBoardVisible = () => {};
        }
        this.lastBoardRefresh = 0;
        this.raceStartAt = null;
        this.raceBoardElapsedFrozen = null;

        // 상단 SPEED/RANK 보드판은 요청에 따라 제거

        // 트랙 밑 패널 — 달리기는 화면 아무 곳이나 터치/클릭
        const trackBottom = trackTop + trackH;
        const gapBelowTrack = Math.round(20 * scaleY);
        const barTop = trackBottom;
        scene.add.rectangle(width / 2, (barTop + height) / 2, width, height - barTop, 0x1a1a1a, 0.9).setScrollFactor(0).setDepth(100);

        const tryTapRun = () => {
            if (!this.player) return;
            if (this.preStart) return;
            if (this.player.getData('finished')) return;
            if (this.isFailing || this.isJumping) return;
            const prevX = this.player.x;
            this.player.x = Math.min(this.player.x + 60, TARGET_DISTANCE);
            if (this.player.x !== prevX) {
                const now = this.time.now || 0;
                const interval = now - (this.lastTapTime || now);
                this.lastTapTime = now;
                const tapsPerSec = interval > 0 ? 1000 / interval : 0;
                this.speed = Phaser.Math.Linear(this.speed, tapsPerSec, 0.3);
                const gaugeBefore = this.runGauge || 0;
                this.runGauge = Math.min(this.runGaugeMax, gaugeBefore + this.runGaugeIncrement);
                if (this.refreshRunGaugeUI) this.refreshRunGaugeUI();
                if (this.runGauge > gaugeBefore && this.triggerGaugeFlash) this.triggerGaugeFlash();
                this.player.setData('lastMoveTime', now);
                this.player.setVisible(true);
                const myIdx = COLOR_ORDER.indexOf(this.myColor);
                if (this.horsesIdle && this.horsesIdle[myIdx]) {
                    this.horsesIdle[myIdx].setVisible(false);
                    if (this.horsesIdle[myIdx].anims) this.horsesIdle[myIdx].anims.stop();
                }
                const runKey = `run_${this.myColor}`;
                if (scene.anims.exists(runKey) && this.player.anims && !this.player.anims.isPlaying) {
                    this.player.play(runKey);
                }
            }
            if (this.socket) this.socket.emit('horse_move', { x: this.player.x });
        };

        // image_9 기반 RUN/점프 버튼 (기존 점프 버튼 자리에서 2개 나란히)
        const btnH = Math.round(70 * scaleY);
        const btnGap = Math.round(14 * scaleY);
        let btnEachW = Math.round(260 * scaleY);
        const maxPairW = Math.max(200, width - 24);
        if (btnEachW * 2 + btnGap > maxPairW) {
            btnEachW = Math.floor((maxPairW - btnGap) / 2);
        }
        const pairW = btnEachW * 2 + btnGap;
        const pairLeftX = Math.round(width / 2 - pairW / 2);
        const runBtnX = pairLeftX + Math.round(btnEachW / 2);
        const jumpBtnX = pairLeftX + btnEachW + btnGap + Math.round(btnEachW / 2);
        const jumpBtnY = trackBottom + gapBelowTrack + Math.round(48 * scaleY) + btnH / 2;
        const gaugeW = btnEachW;
        const gaugeH = Math.max(14, Math.round(20 * scaleY));
        const gaugeY = trackBottom - Math.round(34 * scaleY);
        const gaugePad = Math.max(2, Math.round(3 * scaleY));
        const gaugeInnerW = Math.max(8, gaugeW - gaugePad * 2);
        const gaugeInnerH = Math.max(6, gaugeH - gaugePad * 2);
        const gaugeLeftX = runBtnX - Math.round(gaugeW / 2);
        const gaugeDepth = 2100;

        const gaugeStrokeW = Math.max(1, Math.round(2 * scaleY));
        const gaugeStrokeColor = 0x6d6d6d;
        const gaugeStrokeAlpha = 0.95;
        this.runGaugeFrame = scene.add.rectangle(runBtnX, gaugeY, gaugeW, gaugeH, 0x111111, 0.95)
            .setStrokeStyle(gaugeStrokeW, gaugeStrokeColor, gaugeStrokeAlpha)
            .setScrollFactor(0)
            .setDepth(gaugeDepth);
        this.runGaugeFill = scene.add.rectangle(gaugeLeftX + gaugePad, gaugeY, gaugeInnerW, gaugeInnerH, 0xc62828, 1)
            .setOrigin(0, 0.5)
            .setScrollFactor(0)
            .setDepth(gaugeDepth + 1);
        const gaugeThresholdX = gaugeLeftX + gaugePad + Math.round(gaugeInnerW * (this.minJumpGauge / this.runGaugeMax));
        scene.add.rectangle(gaugeThresholdX, gaugeY, Math.max(2, Math.round(3 * scaleY)), gaugeH + Math.max(4, Math.round(5 * scaleY)), 0xffffff, 0.9)
            .setScrollFactor(0)
            .setDepth(gaugeDepth + 2);
        this.runGaugeLeftText = scene.add.text(gaugeLeftX + gaugePad + Math.round(8 * scaleY), gaugeY, 'RUN', {
            fontFamily: '"Press Start 2P","Noto Sans KR",monospace',
            fontSize: Math.max(9, Math.round(11 * scaleY)) + 'px',
            color: '#ffb74d',
            fontStyle: 'bold'
        }).setOrigin(0, 0.5).setScrollFactor(0).setDepth(gaugeDepth + 3);
        this.runGaugeRightText = scene.add.text(gaugeLeftX + gaugeW - gaugePad - Math.round(8 * scaleY), gaugeY, 'JUMP', {
            fontFamily: '"Press Start 2P","Noto Sans KR",monospace',
            fontSize: Math.max(9, Math.round(11 * scaleY)) + 'px',
            color: '#9e9e9e',
            fontStyle: 'bold'
        }).setOrigin(1, 0.5).setScrollFactor(0).setDepth(gaugeDepth + 3);
        const refreshRunGaugeUI = () => {
            const ratio = Phaser.Math.Clamp((this.runGauge || 0) / (this.runGaugeMax || 100), 0, 1);
            const canJump = (this.runGauge || 0) >= (this.minJumpGauge || 0);
            if (this.runGaugeFill) {
                this.runGaugeFill.setScale(ratio, 1);
                this.runGaugeFill.setFillStyle(canJump ? 0x43a047 : 0xc62828, 1);
                this.runGaugeFill.setAlpha(1);
            }
            if (this.runGaugeLeftText) this.runGaugeLeftText.setColor('#ffb74d');
            if (this.runGaugeRightText) this.runGaugeRightText.setColor(canJump ? '#66bb6a' : '#9e9e9e');
            if (this.runGaugeFrame) {
                this.runGaugeFrame.setStrokeStyle(gaugeStrokeW, gaugeStrokeColor, gaugeStrokeAlpha);
                this.runGaugeFrame.setAlpha(1);
            }
        };
        this.refreshRunGaugeUI = refreshRunGaugeUI;
        this.triggerGaugeFlash = () => {
            if (this.runGaugeFxTween) this.runGaugeFxTween.stop();
            if (this.runGaugeFrame) this.runGaugeFrame.setStrokeStyle(gaugeStrokeW + 1, 0xfff59d, 1);
            if (this.runGaugeFill) this.runGaugeFill.setFillStyle(0xffeb3b, 1);
            if (this.runGaugeLeftText) this.runGaugeLeftText.setColor('#fff59d');
            if (this.runGaugeRightText) this.runGaugeRightText.setColor('#fff59d');
            this.runGaugeFxTween = scene.tweens.add({
                targets: [this.runGaugeFill, this.runGaugeFrame],
                alpha: { from: 1, to: 0.72 },
                duration: 90,
                yoyo: true,
                repeat: 1,
                onComplete: () => {
                    if (this.refreshRunGaugeUI) this.refreshRunGaugeUI();
                }
            });
        };
        refreshRunGaugeUI();

        const doJump = () => {
            if (!this.player || this.player.getData('finished')) return;
            if (this.preStart) return;
            if (this.isFailing) return;
            const nowTs = this.time.now || 0;
            if (nowTs < (this.playerFailLockUntil || 0)) return;
            if (!this.playerJumpSprite) {
                const tex = this.player.texture ? this.player.texture.key : null;
                if (!tex || !scene.textures.exists(tex)) return;
                this.playerJumpSprite = scene.add.sprite(this.player.x, this.player.y, tex, this.player.frame ? this.player.frame.name : 0)
                    .setDepth(this.player.depth + 1)
                    .setVisible(false);
                if (this.playerJumpSprite.setRoundPixels) this.playerJumpSprite.setRoundPixels(true);
                const jumpW = this.playerRunDisplayW || this.playerIdleDisplayW || this.player.displayWidth || Math.round(64 * scaleY);
                const jumpH = this.playerRunDisplayH || this.playerIdleDisplayH || this.player.displayHeight || Math.round(48 * scaleY);
                fitJumpSpriteToHorseBox(this.playerJumpSprite, jumpW, jumpH);
            }
            if (this.isJumping) return;
            if ((this.runGauge || 0) < (this.minJumpGauge || 0)) {
                this.player.setData('jumpResult', 'fail');
                this.player.setData('jumpResultUntil', (this.time.now || 0) + 900);
                return;
            }

            // ===== 내 레인에서 앞쪽 가장 가까운 장애물 기준 거리 판정 =====
            const myLane = this.player.getData('lane');
            let nearest = null;
            let nearestDx = Number.MAX_VALUE;
            (this.obstacles || []).forEach((o) => {
                if (o.lane !== myLane) return;
                if (o.sprite.x === this.playerHandledObstacleX) return;
                const obstacleFrontX = o.sprite.x - (o.sprite.displayWidth || 120) / 2;
                const dx = obstacleFrontX - this.player.x;
                if (dx >= 0 && dx < nearestDx) {
                    nearestDx = dx;
                    nearest = o;
                }
            });
            if (!nearest) return; // 앞에 장애물이 없으면 점프 무시

            // 허들/물웅덩이 앞에서만 점프 허용: 주황(가능) & 빨강(퍼펙트)
            const maxRange = this.jumpMaxRange || 380;
            const successFar = this.jumpSuccessFar || 300;
            const successNear = this.jumpSuccessNear || 120;
            if (nearestDx > maxRange) return;

            const inSuccessWindow = nearestDx <= successFar && nearestDx >= successNear;

            // 주황이지만 퍼펙트가 아니면 실패 연출
            if (!inSuccessWindow) {
                if (this.playerFailSprite && this.playerFailAnimKey && !this.isFailing) {
                    this.isFailing = true;
                    this.playerHandledObstacleX = nearest.sprite.x;
                    this.playerFailLockUntil = nowTs + 400;
                    const obstacleWidth = nearest.sprite.displayWidth || 120;
                    const safeMargin = 80;
                    const escapeX = Math.min(nearest.sprite.x + obstacleWidth / 2 + safeMargin, TARGET_DISTANCE);
                    this.playerFailSprite.setPosition(this.player.x, this.player.y + (this.failOverlayYOffset || 0));
                    this.playerFailSprite.setVisible(true);
                    this.player.setVisible(false);
                    if (this.playerFailSprite.anims) this.playerFailSprite.anims.stop();
                    this.playerFailSprite.removeAllListeners(Phaser.Animations.Events.ANIMATION_COMPLETE);
                    if (this.playerFailAnimKey === 'fail_blue' && scene.textures.exists('fail_blue_frame_0')) this.playerFailSprite.setTexture('fail_blue_frame_0');
                    if (this.playerFailAnimKey === 'fail_green' && scene.textures.exists('fail_green_frame_0')) this.playerFailSprite.setTexture('fail_green_frame_0');
                    if (this.playerFailAnimKey === 'fail_red' && scene.textures.exists('fail_red_frame_0')) this.playerFailSprite.setTexture('fail_red_frame_0');
                    if (this.playerFailAnimKey === 'fail_yellow' && scene.textures.exists('fail_yellow_frame_0')) this.playerFailSprite.setTexture('fail_yellow_frame_0');
                    this.playerFailSprite.play(this.playerFailAnimKey);
                    this.playerFailSprite.once(Phaser.Animations.Events.ANIMATION_COMPLETE, () => {
                        if (!this.player) return;
                        this.player.setVisible(true);
                        this.player.x = escapeX;
                        if (this.socket) this.socket.emit('horse_move', { x: this.player.x });
                        this.playerFailSprite.setVisible(false);
                        this.isFailing = false;
                        this.playerFailLockUntil = (this.time.now || 0) + 250;
                        this.jumpBlockedAfterFail = true;
                        this.jumpFailTimePenalty = true;
                        this.player.setData('jumpResult', 'fail');
                        this.player.setData('jumpResultUntil', (this.time.now || 0) + 2000);
                    });
                }
                return;
            }

            // 성공 구간에서만 실제 점프 궤적 처리
            this.isJumping = true;
            this.isJumpingSuccess = true;

            const startX = this.player.x;
            const obstacleWidth = nearest.sprite.displayWidth || 120;
            const safeMargin = 80;
            const targetX = Math.min(nearest.sprite.x + obstacleWidth / 2 + safeMargin, TARGET_DISTANCE);

            const baseJumpY = this.player.y - horseSize * 0.7;
            this.playerJumpSprite.setPosition(startX, baseJumpY);
            this.playerJumpSprite.setVisible(true);
            this.player.setVisible(false);

            this.jumpStartX = startX;
            this.jumpTargetX = targetX;
            this.jumpBaseY = baseJumpY;
            this.jumpElapsed = 0;
            this.playerHandledObstacleX = nearest.sprite.x;

            this.player.x = targetX;
            if (this.socket) this.socket.emit('horse_move', { x: this.player.x });
            if (this.playerJumpAnimKey) this.playerJumpSprite.play(this.playerJumpAnimKey);
        };

        // RUN 버튼
        const runButton = new RhythmButton(scene, runBtnX, jumpBtnY, {
            width: btnEachW,
            height: btnH,
            mainColor: 0xff9800,
            label: 'RUN',
            fontSize: Math.round(32 * scaleY),
            pressScale: 0.95,
            pressOffsetY: Math.round(4 * scaleY),
            pressDarkenFactor: 0.80,
            depthPx: Math.max(3, Math.round(6 * scaleY)),
            onDown: () => tryTapRun()
        });

        // 점프 버튼
        const jumpButton = new RhythmButton(scene, jumpBtnX, jumpBtnY, {
            width: btnEachW,
            height: btnH,
            mainColor: 0x43a047,
            label: '점프',
            fontSize: Math.round(30 * scaleY),
            pressScale: 0.95,
            pressOffsetY: Math.round(4 * scaleY),
            pressDarkenFactor: 0.80,
            depthPx: Math.max(3, Math.round(6 * scaleY)),
            onDown: () => doJump()
        });

        // 글로벌 '아무 곳이나 탭 = run' 예외 처리용
        this.rhythmRunHitArea = runButton.hitArea;
        this.rhythmJumpHitArea = jumpButton.hitArea;

        const fsBtn = scene.add.text(width - 60, 40, '⛶', { fontSize: '40px', fill: '#fff' }).setInteractive().setScrollFactor(0).setDepth(2000);
        fsBtn.on('pointerdown', () => {
            if (!scene.scale.isFullscreen) scene.scale.startFullscreen();
            else scene.scale.stopFullscreen();
        });
        let soloExitBtn = null;
        if (this.soloMode) {
            soloExitBtn = scene.add.text(width - 155, 42, '나가기', {
                fontSize: Math.max(18, Math.round(24 * scaleY)) + 'px',
                fill: '#ffffff',
                backgroundColor: '#37474f',
                fontStyle: 'bold',
                padding: { x: 10, y: 6 }
            }).setInteractive({ useHandCursor: true }).setScrollFactor(0).setDepth(2000);
            soloExitBtn.on('pointerdown', () => {
                try {
                    if (window.gameState && window.gameState.socket) window.gameState.socket.disconnect();
                } catch (e) { /* ignore */ }
                const overlay = document.getElementById('ui-overlay');
                const title = document.getElementById('title-panel');
                const lobby = document.getElementById('lobby-panel');
                if (overlay) { overlay.classList.remove('hidden'); overlay.classList.add('active'); }
                if (title) title.classList.remove('hidden');
                if (lobby) lobby.classList.add('hidden');
                this.scene.start('Title');
            });
        }

        // 화면 아무 곳이나 터치/클릭 → 달리기 (점프·전체화면 버튼은 제외)
        scene.input.on('pointerdown', (pointer, gameObjects) => {
            const top = gameObjects && gameObjects[0];
            if (top === fsBtn || top === soloExitBtn || top === this.rhythmRunHitArea || top === this.rhythmJumpHitArea) return;
            tryTapRun();
        });

        scene.cameras.main.setBounds(0, 0, TARGET_DISTANCE + 500, height);
        this.bubbleOffsetX = Math.round(160 * scaleY);
        // 카메라는 플레이어를 따라가되, 화면 중앙에서 약간 왼쪽에 보이도록 오프셋 조정
        scene.cameras.main.startFollow(this.player, true, 0.1, 0.1, -120, 0);

        // 소켓: 다른 플레이어 위치 실시간 수신 (탭 빠를수록 앞서 나가며, 뒤로 되감기 방지)
        if (this.socket) {
            this.socket.on('horse_position', (data) => {
                const horseIdx = COLOR_ORDER.indexOf(data.color);
                const horse = this.horses[horseIdx];
                if (!horse) return;
                if (this.preStart) return;
                // 인간(접속 플레이어) 색만 소켓으로 이동 반영 — AI 말은 로컬 전용이라 덮어쓰면 점프/전진이 깨짐(com1 등)
                if (this.playerColors && this.playerColors.size > 0 && !this.playerColors.has(data.color)) return;
                const isFinish = data.x >= TARGET_DISTANCE;
                if (data.x > horse.x || isFinish) {
                    const newX = isFinish ? TARGET_DISTANCE : data.x;
                    if (newX !== horse.x) {
                        horse.x = newX;
                        horse.setData('lastMoveTime', scene.time.now || 0);
                        const runKey = `run_${data.color}`;
                        if (this.anims && this.anims.exists(runKey) && horse.anims && !horse.anims.isPlaying) {
                            horse.play(runKey);
                        }
                        // 원격 말이 움직이면 idle 이미지는 숨김
                        horse.setVisible(true);
                        const idleSprite = this.horsesIdle && this.horsesIdle[horseIdx] ? this.horsesIdle[horseIdx] : null;
                        if (idleSprite) {
                            idleSprite.setVisible(false);
                            if (idleSprite.anims) idleSprite.anims.stop();
                        }
                    }
                    if (isFinish) {
                        horse.setData('finished', true);
                        if (horse.anims) horse.anims.stop();
                        const idx = horseIdx;
                        const name = (this.nameLabels && this.nameLabels[idx]) ? this.nameLabels[idx].name : (data.nickname || data.color);
                        const ft =
                            data.finishTimeSec != null && typeof data.finishTimeSec === 'number'
                                ? data.finishTimeSec
                                : undefined;
                        this.addToFinishOrder(data.color, name, ft);
                    }
                }
            });
            this.socket.on('race_finished', (data) => {
                this.showResult(data);
            });
        }
        this.syncFrameCount = 0;
        this.finishOrder = [];
    }
    addToFinishOrder(color, name, finishTimeSec, timedOut = false) {
        if (this.finishOrder.some((e) => e.color === color)) return;
        let ft = finishTimeSec;
        if (ft == null && this.raceStartAt && !timedOut) {
            ft = Math.max(0, ((this.time.now || 0) - this.raceStartAt) / 1000);
        }
        this.finishOrder.push({ color, name, finishTimeSec: ft, timedOut: !!timedOut });
        if (this.finishOrder.length === 1 && !timedOut) {
            this.firstFinishAtMs = this.time.now || 0;
        }
        const cidx = typeof COLOR_ORDER !== 'undefined' ? COLOR_ORDER.indexOf(color) : -1;
        if (cidx >= 0 && this.horses && this.horses[cidx]) {
            this.horses[cidx].setData('finishTimeSec', ft);
            this.horses[cidx].setData('timedOut', !!timedOut);
        }
        // 내 말이 결승선을 통과한 경우, 순위 기록
        if (color === this.myColor) {
            this.myRank = this.finishOrder.length;
        }
        // DB: 방장은 모든 말 기록, 비방장은 본인 말만 전송 (서버에서 검증)
        if (this.socket && this.raceId) {
            const isHostUser = window.gameState && window.gameState.isHost;
            if (isHostUser || color === this.myColor) {
                this.socket.emit('race_time_record', {
                    raceId: this.raceId,
                    color,
                    nickname: stripBoardNickname(name),
                    rank: this.finishOrder.length,
                    finishTimeSec: ft != null ? ft : null
                });
            }
        }
    }
    update(time, delta) {
        const scene = this;
        const dt = delta || 16;
        if (!this.preStart && this.player && !this.player.getData('finished')) {
            const prevGauge = this.runGauge || 0;
            this.runGauge = Math.max(0, prevGauge - (this.runGaugeDecayPerSec * (dt / 1000)));
            if (Math.abs(this.runGauge - prevGauge) > 0.001 && this.refreshRunGaugeUI) this.refreshRunGaugeUI();
        }
        // 장애물 접근 시: 바닥 주황(점프 가능) 점멸, 퍼펙트 구간만 빨강 펄스
        const now = this.time.now || 0;
        const maxRangeZ = this.jumpMaxRange || 380;
        const successFarZ = this.jumpSuccessFar || 300;
        const successNearZ = this.jumpSuccessNear || 120;
        (this.obstacles || []).forEach((o) => {
            if (!o.zoneOrange && !o.zonePerfect) return;
            const h = this.horses && this.horses[o.lane];
            if (!h || h.getData('finished')) {
                if (o.zoneOrange) o.zoneOrange.setVisible(false);
                if (o.zonePerfect) o.zonePerfect.setVisible(false);
                return;
            }
            const obstacleFrontX = o.sprite.x - (o.sprite.displayWidth || 120) / 2;
            const dx = obstacleFrontX - h.x;
            if (dx > 0 && dx <= maxRangeZ) {
                if (o.zoneOrange) {
                    o.zoneOrange.setVisible(true);
                    const blink = 0.22 + 0.55 * (0.5 + 0.5 * Math.sin(now * 0.011));
                    o.zoneOrange.setAlpha(blink);
                }
                const inPerfect = dx <= successFarZ && dx >= successNearZ;
                if (o.zonePerfect) {
                    if (inPerfect) {
                        o.zonePerfect.setVisible(true);
                        const pulse = 0.4 + 0.55 * (0.5 + 0.5 * Math.sin(now * 0.022));
                        o.zonePerfect.setAlpha(pulse);
                    } else {
                        o.zonePerfect.setVisible(false);
                    }
                }
            } else {
                if (o.zoneOrange) o.zoneOrange.setVisible(false);
                if (o.zonePerfect) o.zonePerfect.setVisible(false);
            }
        });
        // 점프 중이면 포물선 궤적으로 위치/높이 업데이트 (성공 케이스만)
        if (this.isJumping && this.isJumpingSuccess && this.playerJumpSprite) {
            this.jumpElapsed += dt;
            const t = Math.min(1, this.jumpElapsed / this.jumpDuration);
            // X는 시작 위치에서 착지 위치까지 선형 보간
            const newX = Phaser.Math.Linear(this.jumpStartX, this.jumpTargetX, t);
            // Y는 포물선 궤적으로 (t=0.5에서 최고점)
            const jumpHeight = (this.horseSize || 50) * 1.6; // 허들을 살짝 넘는 정도
            const parabola = 4 * t * (1 - t);   // 0~1~0
            const newY = this.jumpBaseY - jumpHeight * parabola;
            this.playerJumpSprite.setPosition(newX, newY);

            if (t >= 1) {
                // 점프 종료: 말은 착지 위치에서 다시 달리기
                if (this.player) {
                    this.player.setVisible(true);
                    this.player.x = this.jumpTargetX;
                    this.player.setData('jumpResult', 'success');
                    this.player.setData('jumpResultUntil', (this.time.now || 0) + 1800);
                }
                this.playerJumpSprite.setVisible(false);
                this.isJumping = false;
                this.isJumpingSuccess = false;
            }
        }

        // ===== 장애물과의 충돌 감지: 점프하지 않고 그냥 달려가면 실패 애니메이션 =====
        if (!this.isJumping && !this.isFailing && this.player && !this.player.getData('finished')) {
            const nowTs = this.time.now || 0;
            if (nowTs >= (this.playerFailLockUntil || 0)) {
                const myLane = this.player.getData('lane');
                const px = this.player.x;
                const pIdx = COLOR_ORDER.indexOf(this.myColor);
                const prevPx =
                    pIdx >= 0 && typeof this.horsePrevX[pIdx] === 'number' ? this.horsePrevX[pIdx] : px;
                let collided = false;
                let collidedObstacle = null;
                (this.obstacles || []).forEach((o) => {
                    if (collided) return;
                    if (o.lane !== myLane) return;
                    if (o.sprite.x === this.playerHandledObstacleX) return;
                    const ox = o.sprite.x;
                    const halfW = (o.sprite.displayWidth || 120) * 0.4;
                    const bandL = ox - halfW;
                    const bandR = ox + halfW;
                    const inBand = px >= bandL && px <= bandR;
                    const segLo = Math.min(prevPx, px);
                    const segHi = Math.max(prevPx, px);
                    const crossedBand = segHi >= bandL && segLo <= bandR;
                    if (inBand || crossedBand) {
                        collided = true;
                        collidedObstacle = { x: ox, halfW };
                    }
                });
                if (collided && this.playerFailSprite && this.playerFailAnimKey && collidedObstacle) {
                    this.isFailing = true;
                    this.playerHandledObstacleX = collidedObstacle.x;
                    this.playerFailLockUntil = nowTs + 400;
                    this.playerFailSprite.setPosition(this.player.x, this.player.y + (this.failOverlayYOffset || 0));
                    this.playerFailSprite.setVisible(true);
                    this.player.setVisible(false);
                    if (this.playerFailSprite.anims) this.playerFailSprite.anims.stop();
                    this.playerFailSprite.removeAllListeners(Phaser.Animations.Events.ANIMATION_COMPLETE);
                    if (this.playerFailAnimKey === 'fail_blue' && scene.textures.exists('fail_blue_frame_0')) this.playerFailSprite.setTexture('fail_blue_frame_0');
                    if (this.playerFailAnimKey === 'fail_green' && scene.textures.exists('fail_green_frame_0')) this.playerFailSprite.setTexture('fail_green_frame_0');
                    if (this.playerFailAnimKey === 'fail_red' && scene.textures.exists('fail_red_frame_0')) this.playerFailSprite.setTexture('fail_red_frame_0');
                    if (this.playerFailAnimKey === 'fail_yellow' && scene.textures.exists('fail_yellow_frame_0')) this.playerFailSprite.setTexture('fail_yellow_frame_0');
                    this.playerFailSprite.play(this.playerFailAnimKey);
                    const escapeX = Math.min(
                        collidedObstacle.x + collidedObstacle.halfW + 60,
                        TARGET_DISTANCE
                    );
                    this.playerFailSprite.once(Phaser.Animations.Events.ANIMATION_COMPLETE, () => {
                        if (!this.player) return;
                        this.player.setVisible(true);
                        this.player.x = escapeX; // 장애물을 완전히 지난 위치로 이동
                        if (this.socket) this.socket.emit('horse_move', { x: this.player.x });
                        this.playerFailSprite.setVisible(false);
                        this.isFailing = false;
                        this.playerFailLockUntil = (this.time.now || 0) + 250;
                        this.jumpBlockedAfterFail = true;
                        this.jumpFailTimePenalty = true;
                        this.player.setData('jumpResult', 'fail');
                        this.player.setData('jumpResultUntil', (this.time.now || 0) + 2000);
                    });
                }
            }
        }

        // ===== 말 정지/달리기 상태 처리 (idle(대기 이미지) ↔ run 애니메이션) =====
        const idleThreshold = 300; // ms, 이 시간 동안 x 변화가 없으면 idle로 전환
        const renderShiftX = this.preStart ? this.waitingShiftX : 0;

        this.horses.forEach((h, idx) => {
            if (!h) return;
            if (h.getData('disabled')) {
                h.setVisible(false);
                const idleSpriteHidden = this.horsesIdle && this.horsesIdle[idx] ? this.horsesIdle[idx] : null;
                if (idleSpriteHidden) {
                    idleSpriteHidden.setVisible(false);
                    if (idleSpriteHidden.anims) idleSpriteHidden.anims.stop();
                }
                this.horsePrevX[idx] = h.x;
                return;
            }

            const idleSprite = this.horsesIdle && this.horsesIdle[idx] ? this.horsesIdle[idx] : null;
            const color = h.getData('color');
            const idleAnimKey = color ? `idle_${color}` : null;
            const idleSheetKeyForUpdate = color ? `idle_${color}_sheet` : null;

            if (idleSprite) {
                idleSprite.setPosition(h.x - renderShiftX, h.y);
            }

            // 점프/실패 연출 중에는 idle 이미지만 표시하지 않도록 우선순위 처리
            if (h === this.player && (this.isJumping || this.isFailing)) {
                h.setVisible(false);
                if (idleSprite) {
                    idleSprite.setVisible(false);
                    if (idleSprite.anims) idleSprite.anims.stop();
                }
                this.horsePrevX[idx] = h.x;
                return;
            }

            const finished = !!h.getData('finished');

            if (this.preStart || finished) {
                // 출발 전에는 전부 대기 이미지(그리고 보이기만 약간 뒤로)로 표시
                h.setVisible(false);
                if (idleSprite) {
                    idleSprite.setVisible(true);
                    if (finished) {
                        if (idleSprite.anims) idleSprite.anims.stop();
                        if (idleSheetKeyForUpdate && scene.textures.exists(idleSheetKeyForUpdate)) {
                            idleSprite.setTexture(idleSheetKeyForUpdate, 0);
                        }
                    } else {
                        if (idleAnimKey && scene.anims.exists(idleAnimKey)) {
                            if (!idleSprite.anims || !idleSprite.anims.isPlaying) idleSprite.play(idleAnimKey);
                        }
                    }
                }
                this.horsePrevX[idx] = h.x;
                return;
            }

            const lastMove = h.getData('lastMoveTime') || 0;
            const isMoving = (time || 0) - lastMove <= idleThreshold;

            if (isMoving) {
                // 최근에 움직였으면 run 표시
                h.setVisible(true);
                if (idleSprite) {
                    idleSprite.setVisible(false);
                    if (idleSprite.anims) idleSprite.anims.stop();
                }
                const runKey = color ? `run_${color}` : null;
                if (runKey && this.anims && this.anims.exists(runKey) && h.anims && !h.anims.isPlaying) {
                    h.play(runKey);
                }
            } else {
                // 움직이지 않으면 idle 표시(대기 프레임 루프)
                h.setVisible(false);
                if (h.anims) h.anims.stop();
                if (idleSprite) {
                    idleSprite.setVisible(true);
                    if (idleAnimKey && scene.anims.exists(idleAnimKey)) {
                        if (!idleSprite.anims || !idleSprite.anims.isPlaying) idleSprite.play(idleAnimKey);
                    }
                }
            }

            this.horsePrevX[idx] = h.x;
        });
        // 관중 스프라이트 미세 상하 움직임
        if (this.crowdMembers && this.crowdMembers.length) {
            for (let i = 0; i < this.crowdMembers.length; i++) {
                const cm = this.crowdMembers[i];
                if (!cm.spr || !cm.spr.active) continue;
                cm.spr.y = Math.round(cm.baseY + Math.sin((time || 0) * cm.speed + cm.phase) * cm.amp);
            }
        }
        // 전광판: 현재 순위 / 경과 시간 / 결승 기록 (점프 성공·실패 동그라미 없음)
        if (this.raceBoardText && this.horses && this.horses.length && (time - (this.lastBoardRefresh || 0) >= 200 || !this.lastBoardRefresh)) {
            this.lastBoardRefresh = time || 0;
            const sorted = this.horses
                .map((h, idx) => ({ h, idx, x: (h && typeof h.x === 'number') ? h.x : 0 }))
                .sort((a, b) => b.x - a.x);
            let elapsedSec = this.raceStartAt ? Math.max(0, ((this.time.now || 0) - this.raceStartAt) / 1000) : 0;
            const allFinished =
                this.horses.length > 0 &&
                this.horses.every((h) => h && h.getData('finished'));
            if (allFinished) {
                if (this.raceBoardElapsedFrozen == null) {
                    this.raceBoardElapsedFrozen = elapsedSec;
                }
                elapsedSec = this.raceBoardElapsedFrozen;
            }
            const lines = [`TIME ${elapsedSec.toFixed(1)}s`];
            for (let rank = 0; rank < Math.min(4, sorted.length); rank++) {
                const item = sorted[rank];
                const horse = item.h;
                const name = (this.nameLabels && this.nameLabels[item.idx] && this.nameLabels[item.idx].name) ? this.nameLabels[item.idx].name : `말${item.idx + 1}`;
                const timeCell = horse && horse.getData('finished')
                    ? formatFinishTimeDisplay(horse.getData('finishTimeSec'))
                    : '--';
                lines.push(`${rank + 1}. ${name}  ${timeCell}`);
            }
            this.raceBoardText.setText(lines.join('\n'));
        }
        // 펜스가 카메라 화면에 항상 보이도록 위치 보정
        if (this.fenceRect && this.fenceRect.active) {
            this.fenceRect.x = this.cameras.main.scrollX + this.scale.width / 2;
        }
        // 말 이름 라벨: 말 후미 쪽에 따라다니도록 위치 갱신
        if (this.nameLabels) {
            this.nameLabels.forEach((item, idx) => {
                const h = this.horses[idx];
                if (!h) return;
                const scaleY = this.scale ? (this.scale.height / 960) : 1;
                const offsetX = Math.round(-80 * scaleY);
                const offsetY = Math.round(-40 * scaleY);
                const renderShiftX = this.preStart ? this.waitingShiftX : 0;
                item.label.setPosition(h.x - renderShiftX + offsetX, h.y + offsetY);
            });
        }
        // 참가 없는 말 = AI: 자동으로 전진 + 장애물 점프/실패 연출, 결승 시 순서 기록
        if (!this.preStart) {
            this.horses.forEach((h, idx) => {
                if (!h || h.getData('disabled')) return;
                const color = h.getData('color');
                if (this.playerColors.has(color)) return;
                if (h.getData('finished')) return;

                const now = time || 0;
                const prevX = h.x;
                const aiJumpSprite = this.aiJumpSprites && this.aiJumpSprites[idx] ? this.aiJumpSprites[idx] : null;
                const aiFailSprite = this.aiFailSprites && this.aiFailSprites[idx] ? this.aiFailSprites[idx] : null;
                const aiIdleSprite = this.horsesIdle && this.horsesIdle[idx] ? this.horsesIdle[idx] : null;

                // ===== AI 점프/실패 연출 진행 =====
                const aiAction = h.getData('aiAction') || '';
                if (aiAction === 'jump') {
                    const dur = h.getData('aiActionDuration') || this.aiJumpActionDurationMs || 520;
                    const elapsed = (h.getData('aiActionElapsed') || 0) + dt;
                    const t = Math.min(1, elapsed / dur);
                    const sx = h.getData('aiActionStartX') || h.x;
                    const tx = h.getData('aiActionTargetX') || h.x;
                    const sy = h.getData('aiActionStartY') || h.y;
                    const nx = Phaser.Math.Linear(sx, tx, t);
                    const jumpHeight = (this.horseSize || 50) * 1.4;
                    const parabola = 4 * t * (1 - t);
                    const ny = sy - jumpHeight * parabola;
                    h.x = nx;
                    h.setData('lastMoveTime', now);
                    if (aiIdleSprite) {
                        aiIdleSprite.setVisible(false);
                        if (aiIdleSprite.anims) aiIdleSprite.anims.stop();
                    }
                    if (aiJumpSprite) {
                        aiJumpSprite.setVisible(true).setPosition(nx, ny);
                        h.setVisible(false);
                    } else {
                        h.setVisible(true);
                        h.y = ny;
                    }
                    h.setData('aiActionElapsed', elapsed);
                    if (t >= 1) {
                        h.setData('aiAction', '');
                        h.setData('aiActionElapsed', 0);
                        h.setVisible(true);
                        if (aiIdleSprite) aiIdleSprite.setVisible(false);
                        if (aiJumpSprite) aiJumpSprite.setVisible(false);
                        h.y = sy;
                        h.setData('jumpResult', 'success');
                        h.setData('jumpResultUntil', (this.time.now || 0) + 1800);
                    }
                    return;
                }
                if (aiAction === 'fail') {
                    const dur = h.getData('aiActionDuration') || this.aiFailActionDurationMs || 900;
                    const elapsed = (h.getData('aiActionElapsed') || 0) + dt;
                    h.setData('aiActionElapsed', elapsed);
                    if (aiIdleSprite) {
                        aiIdleSprite.setVisible(false);
                        if (aiIdleSprite.anims) aiIdleSprite.anims.stop();
                    }
                    if (aiFailSprite) {
                        const fyAi = (color === 'blue' || color === 'green' || color === 'red' || color === 'yellow') ? this.failStripYOffset : 0;
                        aiFailSprite.setVisible(true).setPosition(h.x, h.y + fyAi);
                        h.setVisible(false);
                    } else {
                        h.setVisible(true);
                    }
                    if (elapsed >= dur) {
                        const failTargetX = h.getData('aiActionTargetX');
                        if (typeof failTargetX === 'number') {
                            h.x = Math.min(Math.max(failTargetX, h.x), TARGET_DISTANCE);
                        }
                        h.setData('aiAction', '');
                        h.setData('aiActionElapsed', 0);
                        h.setData('aiActionTargetX', null);
                        h.setVisible(true);
                        if (aiIdleSprite) aiIdleSprite.setVisible(false);
                        if (aiFailSprite) aiFailSprite.setVisible(false);
                        h.setData('jumpResult', 'fail');
                        h.setData('jumpResultUntil', (this.time.now || 0) + 2000);
                    }
                    return;
                }

                // 장애물 근처에서 점프/실패 판정 (한 장애물당 한 번)
                const myLane = h.getData('lane');
                const slowUntil = h.getData('aiSlowUntil') || 0;
                const baseSpeed = Phaser.Math.FloatBetween(0.9, 1.55);
                const speed = (now < slowUntil ? baseSpeed * 0.35 : baseSpeed) * AI_RUN_SPEED_MULTIPLIER;
                const lastAiX = prevX;

                const applyAiObstacle = (ob) => {
                    const success = Math.random() < 0.65;
                    const obstacleWidth = ob.sprite.displayWidth || 120;
                    const safeMargin = 80;
                    const pastObstacleX = Math.min(ob.sprite.x + obstacleWidth / 2 + safeMargin, TARGET_DISTANCE);
                    if (success) {
                        const targetX = pastObstacleX;
                        h.setData('aiAction', 'jump');
                        h.setData('aiActionStartX', h.x);
                        h.setData('aiActionTargetX', targetX);
                        h.setData('aiActionStartY', h.y);
                        h.setData('aiActionDuration', this.aiJumpActionDurationMs || 520);
                        h.setData('aiActionElapsed', 0);
                        if (aiJumpSprite && scene.anims.exists(`jump_${color}`)) {
                            aiJumpSprite.setPosition(h.x, h.y).setVisible(true);
                            aiJumpSprite.play(`jump_${color}`);
                            h.setVisible(false);
                        }
                    } else {
                        h.x = Math.max(h.x - 20, 0);
                        h.setData('aiSlowUntil', now + 900);
                        h.setData('aiActionTargetX', pastObstacleX);
                        if (h.setTint) h.setTint(0xff6666);
                        h.setData('aiAction', 'fail');
                        const failDurMs = (aiFailSprite && scene.anims.exists(`fail_${color}`))
                            ? (this.aiFailActionDurationMs || 3000)
                            : 900;
                        h.setData('aiActionDuration', failDurMs);
                        h.setData('aiActionElapsed', 0);
                        if (aiFailSprite && scene.anims.exists(`fail_${color}`)) {
                            const fyAi2 =
                                color === 'blue' || color === 'green' || color === 'red' || color === 'yellow'
                                    ? this.failStripYOffset
                                    : 0;
                            aiFailSprite.setPosition(h.x, h.y + fyAi2).setVisible(true);
                            if (aiFailSprite.anims) aiFailSprite.anims.stop();
                            if (color === 'blue' && scene.textures.exists('fail_blue_frame_0')) aiFailSprite.setTexture('fail_blue_frame_0');
                            if (color === 'green' && scene.textures.exists('fail_green_frame_0')) aiFailSprite.setTexture('fail_green_frame_0');
                            if (color === 'red' && scene.textures.exists('fail_red_frame_0')) aiFailSprite.setTexture('fail_red_frame_0');
                            if (color === 'yellow' && scene.textures.exists('fail_yellow_frame_0')) aiFailSprite.setTexture('fail_yellow_frame_0');
                            aiFailSprite.play(`fail_${color}`);
                            h.setVisible(false);
                        }
                    }
                    h.setData('handledObstacleX', ob.sprite.x);
                };

                let nearest = null;
                let nearestDx = Number.MAX_VALUE;
                (this.obstacles || []).forEach((o) => {
                    if (o.lane !== myLane) return;
                    const dx = o.sprite.x - h.x;
                    if (dx >= 0 && dx < nearestDx) {
                        nearestDx = dx;
                        nearest = o;
                    }
                });
                if (nearest) {
                    const handledX = h.getData('handledObstacleX') || -9999;
                    const maxRange = this.jumpMaxRange || 380;
                    if (nearest.sprite.x !== handledX && nearestDx <= maxRange && nearestDx >= 0) {
                        applyAiObstacle(nearest);
                    }
                }

                if (!h.getData('aiAction')) {
                    const prospectiveEnd = h.x + speed;
                    const segLo = Math.min(lastAiX, h.x, prospectiveEnd);
                    const segHi = Math.max(lastAiX, h.x, prospectiveEnd);
                    const laneObs = (this.obstacles || [])
                        .filter((o) => o.lane === myLane)
                        .sort((a, b) => a.sprite.x - b.sprite.x);
                    for (let oi = 0; oi < laneObs.length; oi++) {
                        const ob = laneObs[oi];
                        if (h.getData('handledObstacleX') === ob.sprite.x) continue;
                        const ox = ob.sprite.x;
                        const hw = (ob.sprite.displayWidth || 120) * 0.5;
                        const left = ox - hw;
                        const right = ox + hw;
                        const inBandNow = h.x >= left && h.x <= right;
                        const crossedBand = !(segHi < left || segLo > right);
                        if (!inBandNow && !crossedBand) continue;
                        applyAiObstacle(ob);
                        break;
                    }
                }

                if (h.getData('aiAction')) {
                    return;
                }

                if (now >= slowUntil && h.clearTint) {
                    h.clearTint();
                }
                h.x += speed;

                if (h.x !== prevX) {
                    h.setData('lastMoveTime', now);
                    const runKey = color ? `run_${color}` : null;
                    if (runKey && scene.anims.exists(runKey) && h.anims && !h.anims.isPlaying) {
                        h.play(runKey);
                    }
                }

                if (h.x >= TARGET_DISTANCE) {
                    h.setData('finished', true);
                    if (h.anims) h.anims.stop();
                    const name = (this.nameLabels && this.nameLabels[idx]) ? this.nameLabels[idx].name : color;
                    const fts = this.raceStartAt
                        ? Math.max(0, (now - this.raceStartAt) / 1000)
                        : 0;
                    h.setData('finishTimeSec', fts);
                    this.addToFinishOrder(color, name, fts);
                }
            });
        }

        if (this.player && this.player.x >= TARGET_DISTANCE && !this.player.getData('finished')) {
            this.player.x = TARGET_DISTANCE;
            const now = this.time.now || 0;
            const doPlayerFinish = () => {
                this.player.setData('finished', true);
                if (this.player.anims) this.player.anims.stop();
                const fts = this.raceStartAt
                    ? Math.max(0, (now - this.raceStartAt) / 1000)
                    : 0;
                this.player.setData('finishTimeSec', fts);
                this.addToFinishOrder(this.myColor, window.gameState?.myNickname || this.myColor, fts);
                if (this.socket && this.finishOrder[0] && this.finishOrder[0].color === this.myColor) {
                    this.socket.emit('horse_move', { x: TARGET_DISTANCE, finishTimeSec: fts });
                    this.socket.emit('player_finished', { finishTimeSec: fts });
                }
                this.finishPenaltyDelayUntil = null;
            };
            if (this.jumpFailTimePenalty) {
                if (this.finishPenaltyDelayUntil == null) {
                    this.finishPenaltyDelayUntil = now + 2000;
                }
                if (now < this.finishPenaltyDelayUntil) {
                } else {
                    doPlayerFinish();
                }
            } else {
                doPlayerFinish();
            }
        }
        if (!this.resultShown && this.firstFinishAtMs != null) {
            const nowMs = this.time.now || 0;
            const remainSec = Math.max(0, Math.ceil((10000 - (nowMs - this.firstFinishAtMs)) / 1000));
            if (!this.finishCountdownText) {
                this.finishCountdownText = this.add.text(
                    this.scale.width / 2,
                    Math.round(this.scale.height * 0.08),
                    '',
                    {
                        fontSize: Math.round(Math.min(this.scale.width, this.scale.height) * 0.05) + 'px',
                        fill: '#ffe082',
                        fontStyle: 'bold',
                        stroke: '#000000',
                        strokeThickness: 4
                    }
                ).setOrigin(0.5).setScrollFactor(0).setDepth(4200);
            }
            this.finishCountdownText.setText(`RESULT IN ${remainSec}`);
            this.finishCountdownText.setVisible(true);
        } else if (this.finishCountdownText) {
            this.finishCountdownText.setVisible(false);
        }
        // 1등 결승 후 10초 내 미완주자는 TIMEOUT 처리
        if (!this.resultShown && this.finishOrder.length > 0 && this.firstFinishAtMs != null) {
            const nowMs = this.time.now || 0;
            if (nowMs - this.firstFinishAtMs >= 10000) {
                this.horses.forEach((h, idx) => {
                    if (!h || h.getData('finished')) return;
                    h.setData('finished', true);
                    h.setData('timedOut', true);
                    h.setData('finishTimeSec', null);
                    if (h.anims) h.anims.stop();
                    const color = h.getData('color') || COLOR_ORDER[idx];
                    const name = (this.nameLabels && this.nameLabels[idx]) ? this.nameLabels[idx].name : color;
                    this.addToFinishOrder(color, name, null, true);
                });
            }
        }
        const allRaceFinished = this.horses && this.horses.length > 0 && this.horses.every((h) => h && h.getData('finished'));
        if (allRaceFinished && this.finishOrder.length > 0 && !this.resultShown) {
            const first = this.finishOrder[0];
            const isWinner = first.color === this.myColor;
            this.showResult({ winnerNickname: first.name, winnerColor: first.color, isWinner: isWinner });
            return;
        }
        if (!this.player || this.player.getData('finished')) return;
        if (this.preStart) return;
        // 매 프레임에 가깝게 내 위치 전송 → 다른 유저 화면에 실시간 반영 (탭 빠를수록 앞서 나감)
        this.syncFrameCount = (this.syncFrameCount || 0) + 1;
        if (this.socket && this.syncFrameCount % 3 === 0) {
            this.socket.emit('horse_move', { x: this.player.x });
        }
    }
    showResult(data) {
        if (this.resultShown) return;
        this.resultShown = true;
        if (this.finishCountdownText) {
            this.finishCountdownText.destroy();
            this.finishCountdownText = null;
        }
        if (this.socket) this.socket.removeAllListeners();
        const scene = this;
        const { width, height } = scene.scale;
        const isWinner = data.winnerNickname === (window.gameState && window.gameState.myNickname);
        const depth = 5000;
        // 전체 화면 어두운 배경
        scene.add.rectangle(width / 2, height / 2, width, height, 0x000000, 0.85)
            .setScrollFactor(0)
            .setDepth(depth);

        // 화면 크기에 따라 아주 크게 보이는 승리 문구
        const baseSize = Math.min(width, height);
        const titleFontSize = Math.round(baseSize * 0.09);     // 메인 문구
        const buttonFontSize = Math.round(baseSize * 0.045);   // 버튼 텍스트

        scene.add.text(
            width / 2,
            height / 2 - titleFontSize,
            isWinner ? '축하합니다!\n우승!' : (data.winnerNickname + ' 우승!'),
            {
                fontSize: titleFontSize + 'px',
                fill: '#fff',
                fontStyle: 'bold',
                align: 'center'
            }
        )
            .setOrigin(0.5)
            .setScrollFactor(0)
            .setDepth(depth + 1);

        // 버튼도 화면 비율에 맞춰 아주 크게
        const btnW = Math.min(width * 0.36, 420);
        const btnH = Math.min(height * 0.10, 120);
        const gap = Math.max(32, Math.round(width * 0.04));
        const buttonY = height / 2 + btnH;

        const btnAgainX = width / 2 - gap / 2 - btnW / 2;
        const btnExitX = width / 2 + gap / 2 + btnW / 2;

        const btnAgain = scene.add.rectangle(btnAgainX, buttonY, btnW, btnH, 0x43a047)
            .setScrollFactor(0)
            .setDepth(depth + 2)
            .setInteractive({ useHandCursor: true });
        scene.add.text(
            btnAgainX,
            buttonY,
            '다시 하기',
            {
                fontSize: buttonFontSize + 'px',
                fill: '#fff',
                fontStyle: 'bold'
            }
        )
            .setOrigin(0.5)
            .setScrollFactor(0)
            .setDepth(depth + 3);

        const btnExit = scene.add.rectangle(btnExitX, buttonY, btnW, btnH, 0x757575)
            .setScrollFactor(0)
            .setDepth(depth + 2)
            .setInteractive({ useHandCursor: true });
        scene.add.text(
            btnExitX,
            buttonY,
            '나가기',
            {
                fontSize: buttonFontSize + 'px',
                fill: '#fff',
                fontStyle: 'bold'
            }
        )
            .setOrigin(0.5)
            .setScrollFactor(0)
            .setDepth(depth + 3);

        // ===== 결과 등수 리스트 (갤러그 스타일 하이스코어 보드) =====
        if (this.finishOrder && this.finishOrder.length) {
            const baseY = buttonY + btnH + Math.round(40 * (height / 960));
            const title = scene.add.text(
                width / 2,
                baseY,
                'RANK   NAME            TIME',
                {
                    fontSize: Math.round(26 * (height / 960)) + 'px',
                    fill: '#ffeb3b',
                    fontStyle: 'bold',
                    stroke: '#000000',
                    strokeThickness: 4,
                    fontFamily: 'monospace',
                    align: 'center'
                }
            ).setOrigin(0.5, 0).setScrollFactor(0).setDepth(depth + 4);

            const lineHeight = Math.round(30 * (height / 960));
            this.finishOrder.slice(0, 4).forEach((e, i) => {
                const rank = i + 1;
                const isMe = e.color === this.myColor;
                const rankStr = rank.toString().padStart(2, ' ');
                const nameStr = (e.name || '').padEnd(12, ' ').slice(0, 12);
                const timeStr = (e.timedOut ? 'TIMEOUT' : formatFinishTimeDisplay(e.finishTimeSec)).padStart(7, ' ');
                const lineText = `${rankStr}    ${nameStr}    ${timeStr}`;
                scene.add.text(
                    width / 2,
                    baseY + (i + 1) * lineHeight,
                    (isMe ? '★ ' : '  ') + lineText,
                    {
                        fontSize: Math.round(24 * (height / 960)) + 'px',
                        fill: isMe ? '#00e5ff' : '#ffffff',
                        stroke: '#000000',
                        strokeThickness: 3,
                        fontFamily: 'monospace',
                        align: 'center'
                    }
                ).setOrigin(0.5, 0).setScrollFactor(0).setDepth(depth + 4);
            });
        }
        btnAgain.on('pointerdown', () => { location.reload(); });
        btnExit.on('pointerdown', () => {
            if (window.gameState && window.gameState.socket) window.gameState.socket.disconnect();
            location.reload();
        });
    }
}

// ========== Phaser Config & Start ==========
function startGame() {
    if (typeof Phaser === 'undefined') {
        var el = document.getElementById('ui-overlay');
        if (el) { el.classList.add('active'); el.classList.remove('hidden'); }
        var p = document.getElementById('title-panel');
        if (p) { p.classList.remove('hidden'); p.innerHTML = '<h1>경주마 스타트 Pro</h1><p class="sub">스크립트를 불러오지 못했습니다.</p><p style="color:#b0a090;font-size:14px;margin-top:12px;">네트워크를 확인하거나 새로고침 해 주세요.</p>'; }
        return;
    }
    var config = {
        type: Phaser.AUTO,
        parent: 'game-container',
        pixelArt: true,
        antialias: false,
        roundPixels: true,
        scale: {
            mode: Phaser.Scale.FIT,
            autoCenter: Phaser.Scale.CENTER_BOTH,
            width: 1280,
            height: 2200
        },
        physics: { default: 'arcade' },
        scene: [PreloadScene, TitleScene, LobbyScene, GameScene]
    };
    new Phaser.Game(config);
}
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', startGame);
} else {
    startGame();
}
</script>
</body>
</html>
